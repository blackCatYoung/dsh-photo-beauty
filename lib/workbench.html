<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>美颜工坊</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #101216;
    --panel: #171a20;
    --panel-2: #1d2129;
    --line: #2a2f3a;
    --line-strong: #3a4150;
    --text: #e8ebf2;
    --muted: #8f97a7;
    --accent: #5b8cff;
    --accent-soft: rgba(91, 140, 255, 0.16);
    --accent-hover: #6c98ff;
    --danger: #ff6b6b;
    --ok: #3ddc97;
    --hover: #242935;
    --drop-border: #333a48;
    --track: #2a303b;
    --kbd: #232833;
    --thumb: #fff;
    --scroll-thumb: #2c323d;
    --shadow: 0 12px 40px rgba(0, 0, 0, .45);
    --overlay-bg: rgba(0, 0, 0, .6);
    --overlay-hover: rgba(0, 0, 0, .78);
    --overlay-line: rgba(255, 255, 255, .14);
    --overlay-text: #fff;
    --radius: 12px;
  }
  /* 跟随系统外观：浅色模式下把面板、分隔线、控件和舞台一起换掉，
     而不是只改文字颜色。照片上的角标保持深色玻璃，两种主题都清楚。 */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef1f6;
      --panel: #ffffff;
      --panel-2: #f3f5f9;
      --line: #dde2ea;
      --line-strong: #c3cad7;
      --text: #1b1f27;
      --muted: #66707f;
      --accent: #2f6bff;
      --accent-soft: rgba(47, 107, 255, .10);
      --accent-hover: #1f5bf0;
      --danger: #d92d20;
      --ok: #0f9d63;
      --hover: #e9edf5;
      --drop-border: #c3cad7;
      --track: #e1e5ee;
      --kbd: #eef1f6;
      --thumb: #ffffff;
      --scroll-thumb: #c9d0dc;
      --shadow: 0 12px 34px rgba(23, 34, 59, .18);
    }
  }
  /* 嵌在 DeepSeek Harness 里时，底色和控件颜色改用 DSH 自己的调色板。
     工坊是同源 iframe，脚本把父页面解析后的 --dsw-alias-* 值抄到本页 :root，
     再把当前配色（dark / light）写到 data-dsh-theme 上。选择器比上面的
     :root 和 prefers-color-scheme 块更具体，所以 DSH 浅色 + 系统深色时
     也以 DSH 为准；单独打开（没有 DSH 父页面）时继续跟随系统外观。 */
  :root[data-dsh-theme] {
    --bg: var(--dsw-alias-bg-base);
    --panel: var(--dsw-alias-bg-layer-1);
    --panel-2: var(--dsw-alias-bg-layer-2);
    --line: var(--dsw-alias-border-l1);
    --line-strong: var(--dsw-alias-border-l2);
    --text: var(--dsw-alias-label-primary);
    --muted: var(--dsw-alias-label-secondary);
    --accent: var(--dsw-alias-button-info-fill);
    --accent-soft: color-mix(in srgb, var(--dsw-alias-button-info-fill) 14%, transparent);
    --danger: var(--dsw-alias-state-error-primary);
    --ok: var(--dsw-alias-state-success-primary);
    --hover: var(--dsw-alias-interactive-bg-hover-solid);
    --drop-border: var(--dsw-alias-border-l2);
    --track: var(--dsw-alias-interactive-bg-hover-solid);
    --kbd: var(--dsw-alias-bg-layer-2);
    --thumb: var(--dsw-alias-switch-thumb);
    --scroll-thumb: var(--dsw-alias-scrollbar-bg-l1);
  }
  :root[data-dsh-theme='dark'] {
    --accent-hover: color-mix(in srgb, var(--accent) 82%, #fff);
    --shadow: 0 12px 40px rgba(0, 0, 0, .45);
  }
  :root[data-dsh-theme='light'] {
    --accent-hover: color-mix(in srgb, var(--accent) 88%, #000);
    --shadow: 0 12px 34px rgba(23, 34, 59, .18);
    /* DSH 的浅色调色板里 base / layer-1 / layer-2 都是纯白，画布和右侧面板
       会糊成一整片。这里用 DSH 自己的前景色在面板上加几个百分点的灰，
       分出色阶，仍然是宿主的色系，不引入新颜色。 */
    --panel: color-mix(in srgb, var(--dsw-alias-label-primary) 3.2%, var(--dsw-alias-bg-layer-1));
    --panel-2: color-mix(in srgb, var(--dsw-alias-label-primary) 5.5%, var(--dsw-alias-bg-layer-2));
    --hover: color-mix(in srgb, var(--dsw-alias-label-primary) 5%, var(--dsw-alias-bg-layer-1));
    --track: color-mix(in srgb, var(--dsw-alias-label-primary) 9%, var(--dsw-alias-bg-layer-2));
    --drop-border: color-mix(in srgb, var(--dsw-alias-label-primary) 22%, transparent);
    --line: color-mix(in srgb, var(--dsw-alias-label-primary) 8%, transparent);
    --scroll-thumb: color-mix(in srgb, var(--dsw-alias-label-primary) 18%, transparent);
  }
  /* 主按钮的填充是 DSH 的蓝：深色主题下偏亮的蓝配白字看不清，用 DSH 的
     前景色（深色下是深字，浅色下是白字）。 */
  :root[data-dsh-theme] button.primary { color: var(--dsw-alias-label-primary-foreground); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: 0 0 auto;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  button {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    transition: background .15s, border-color .15s, opacity .15s;
  }
  button:hover:not(:disabled) { background: var(--hover); border-color: var(--line-strong); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  main { flex: 1; display: flex; min-height: 0; }
  #workArea { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #stage {
    flex: 1;
    min-width: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    overflow: hidden;
  }
  /* Filmstrip: one horizontally scrolling row of thumbnails under the preview. */
  #filmstrip {
    flex: 0 0 auto;
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 8px 12px 5px;
  }
  #filmstrip[hidden] { display: none; }
  .film-track {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--scroll-thumb) transparent;
  }
  .film-track::-webkit-scrollbar { height: 8px; }
  .film-track::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 999px; }
  .film-item {
    position: relative;
    flex: 0 0 auto;
    width: 100px;
    margin: 0;
    padding: 4px;
    display: flex;
    flex-direction: column;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 9px;
    cursor: pointer;
  }
  .film-item:hover { background: var(--hover); }
  .film-item.on { background: var(--accent-soft); border-color: var(--accent); }
  .film-item img {
    width: 100%;
    height: 64px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    pointer-events: none;
  }
  .film-item.on img { border-color: var(--accent); }
  .film-index {
    position: absolute;
    left: 8px;
    top: 8px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--overlay-bg);
    color: var(--overlay-text);
    font-size: 9.5px;
    line-height: 15px;
  }
  .film-x {
    position: absolute;
    right: 7px;
    top: 7px;
    width: 18px;
    height: 18px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--overlay-bg);
    color: var(--overlay-text);
    font-size: 12px;
    line-height: 1;
    opacity: 0;
    transition: opacity .12s;
  }
  .film-item:hover .film-x, .film-item:focus-within .film-x { opacity: 1; }
  .film-x:hover:not(:disabled) { background: var(--danger); color: #fff; }
  #drop {
    position: absolute;
    inset: 18px;
    border: 1.5px dashed var(--drop-border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    text-align: center;
    padding: 24px;
    transition: border-color .15s, background .15s;
  }
  #drop.drag { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  #drop .big { font-size: 15px; color: var(--text); }
  #drop small { font-size: 12px; }
  #drop svg { opacity: .8; }
  .preview-wrap {
    position: relative;
    max-width: 100%;
    max-height: 100%;
    display: none;
    transform-origin: 50% 50%;
    will-change: transform;
    touch-action: none;
  }
  .preview-wrap.on { display: block; }
  .preview-wrap.zoomed { cursor: grab; }
  .preview-wrap.zoomed.dragging { cursor: grabbing; }
  .preview-wrap img {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 150px);
    border-radius: 10px;
    box-shadow: var(--shadow);
    user-select: none;
    -webkit-user-drag: none;
  }
  /* The filmstrip takes ~100px at the bottom; keep the preview above it. */
  body.has-film .preview-wrap img { max-height: calc(100vh - 250px); }
  #before {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity .12s;
    pointer-events: none;
  }
  #before.on { opacity: 1; }
  /* Zoomed-in 1:1 crops. These live outside .preview-wrap on purpose: the wrap
     is scaled with a CSS transform, and anything inside it is rasterised at its
     layout size and then stretched — which blurs even a native-resolution
     image. Positioned in screen pixels instead, the browser rasterises the crop
     at the size it is actually drawn, matching a normal image viewer. */
  #zoomLayer {
    position: absolute;
    display: none;
    overflow: hidden;
    pointer-events: none;
    border-radius: 10px;
    z-index: 2;
  }
  #zoomLayer img {
    position: absolute;
    display: none;
    max-width: none;
    max-height: none;
    border-radius: 0;
    box-shadow: none;
    will-change: auto;
  }
  .badge {
    position: absolute;
    left: 24px;
    top: 24px;
    background: var(--overlay-bg);
    backdrop-filter: blur(6px);
    border: 1px solid var(--overlay-line);
    color: var(--overlay-text);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    pointer-events: none;
  }
  .badge:empty { display: none; }
  .zoom-badge {
    left: auto;
    right: 24px;
    top: 24px;
    display: none;
    cursor: pointer;
    pointer-events: auto;
    font-family: inherit;
    background: var(--overlay-bg);
    border: 1px solid var(--overlay-line);
    color: var(--overlay-text);
  }
  .zoom-badge:hover { background: var(--overlay-hover); }
  #compareHint {
    position: absolute;
    right: 24px;
    bottom: 24px;
    font-size: 11px;
    color: var(--overlay-text);
    background: var(--overlay-bg);
    padding: 3px 8px;
    border-radius: 999px;
    pointer-events: none;
    z-index: 6;
  }
  #busy {
    position: absolute;
    right: 24px;
    top: 56px;
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--overlay-text);
    background: var(--overlay-bg);
    padding: 5px 10px;
    border-radius: 999px;
    z-index: 6;
  }
  #busy.on { display: flex; }
  .spin {
    width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  aside {
    width: 312px;
    flex: 0 0 auto;
    border-left: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .scroll { flex: 1; overflow-y: auto; padding: 0 16px 8px; }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 8px; }
  .aside-actions {
    position: sticky;
    top: 0;
    z-index: 6;
    display: flex;
    gap: 8px;
    margin: 0 -16px 10px;
    padding: 12px 16px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 6px 12px -10px rgba(0, 0, 0, .45);
  }
  .aside-actions button { flex: 1; }
  section { margin-bottom: 18px; }
  section h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--muted);
    margin: 0 0 8px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .presets button { padding: 8px 6px; text-align: left; line-height: 1.35; }
  .presets b { display: block; font-size: 12.5px; font-weight: 600; }
  .presets span { color: var(--muted); font-size: 11px; }
  .field { margin-bottom: 13px; }
  .field .row { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .field label, .field .name { font-size: 12.5px; }
  .field .val { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .field .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
  .field .head label { flex: 1; }
  .field .head .val { margin-left: 6px; }
  /* 整体肤色：一个 2D 盘同时调色温（上下）和色调（左右），像 iPhone 的
     摄影风格。盘面本身就是肤色渐变，拖点落在哪儿，预览就往哪儿走。 */
  .tone-frame { position: relative; padding: 12px 18px; margin: 2px 0 0; }
  .tone-pad {
    position: relative;
    height: 150px;
    border-radius: 11px;
    border: 1px solid var(--line-strong);
    overflow: hidden;
    cursor: crosshair;
    touch-action: none;
    outline: none;
    background:
      linear-gradient(180deg,
        rgba(240, 186, 142, .92) 0%,
        rgba(240, 186, 142, 0) 46%,
        rgba(185, 158, 190, 0) 54%,
        rgba(185, 158, 190, .92) 100%),
      linear-gradient(90deg,
        rgba(190, 166, 122, .92) 0%,
        rgba(190, 166, 122, 0) 40%,
        rgba(216, 142, 160, 0) 60%,
        rgba(216, 142, 160, .92) 100%),
      #d7a183;
    box-shadow: inset 0 0 22px rgba(62, 34, 24, .22);
    user-select: none;
  }
  .tone-pad.dragging { cursor: grabbing; }
  .tone-pad::before, .tone-pad::after {
    content: "";
    position: absolute;
    background: rgba(255, 255, 255, .22);
    pointer-events: none;
  }
  .tone-pad::before { left: 0; right: 0; top: 50%; height: 1px; }
  .tone-pad::after { top: 0; bottom: 0; left: 50%; width: 1px; }
  .tone-pad:focus-visible {
    border-color: var(--accent);
    box-shadow: inset 0 0 22px rgba(62, 34, 24, .22), 0 0 0 2px var(--accent-soft);
  }
  .tone-dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 19px;
    height: 19px;
    margin: -9.5px 0 0 -9.5px;
    border-radius: 50%;
    border: 2.5px solid #fff;
    background: rgba(255, 255, 255, .12);
    box-shadow: 0 1px 6px rgba(0, 0, 0, .5), 0 0 0 1px rgba(0, 0, 0, .24);
    pointer-events: none;
  }
  .tone-caption {
    position: absolute;
    color: var(--muted);
    font-size: 9.5px;
    line-height: 1;
    letter-spacing: .5px;
    pointer-events: none;
  }
  .tone-caption.top { top: 2px; left: 50%; transform: translateX(-50%); }
  .tone-caption.bottom { bottom: 2px; left: 50%; transform: translateX(-50%); }
  .tone-caption.left { left: 1px; top: 50%; transform: translateY(-50%); }
  .tone-caption.right { right: 1px; top: 50%; transform: translateY(-50%); }
  .tone-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 3px; }
  #toneVal { font-size: 11.5px; }
  input[type=color] {
    -webkit-appearance: none;
    width: 22px; height: 22px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: none;
    cursor: pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 4px; }
  .hint { color: var(--muted); font-size: 11px; line-height: 1.5; margin: -2px 0 10px; }
  .hint:empty { display: none; }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--track);
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: var(--thumb);
    border: 3px solid var(--accent);
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  footer {
    border-top: 1px solid var(--line);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--panel);
  }
  #status {
    font-size: 11.5px;
    color: var(--muted);
    min-height: 16px;
    word-break: break-all;
  }
  #status.err { color: var(--danger); }
  #status.ok { color: var(--ok); }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 8px 0; }
  .mini { margin-left: auto; padding: 3px 9px; font-size: 11px; border-radius: 6px; font-weight: 500; }
  .count { margin-left: auto; color: var(--muted); font-size: 10.5px; letter-spacing: 0; text-transform: none; font-weight: 500; }
  .seg { display: flex; gap: 6px; margin: 8px 0 12px; }
  .seg button { flex: 1; padding: 5px 0; font-size: 12px; }
  .seg button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .liquify-actions { display: flex; gap: 6px; margin-top: 4px; }
  .liquify-actions button { flex: 1; padding: 5px 0; font-size: 12px; }
  #previewWrap.painting, #previewWrap.painting img,
  #previewWrap.brushing, #previewWrap.brushing img,
  #previewWrap.wrinkling, #previewWrap.wrinkling img { cursor: crosshair; }
  .row-tools { display: flex; align-items: center; gap: 8px; }
  .brush-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10.5px;
    line-height: 1.6;
    color: var(--muted);
  }
  .brush-btn svg { width: 11px; height: 11px; fill: currentColor; }
  .brush-btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .link-btn {
    padding: 0;
    border: 0;
    background: none;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
    text-decoration: underline;
  }
  .link-btn:disabled { color: var(--muted); cursor: default; text-decoration: none; }
  #maskHint b,
  #wrinkleHint b { color: var(--text); font-weight: 600; }
  #warpCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    pointer-events: none;
    z-index: 3;
  }
  #brushCursor {
    position: absolute;
    display: none;
    border: 1.5px solid var(--accent);
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3);
  }
  #liquidTrail {
    position: absolute;
    inset: 0;
    display: none;
    pointer-events: none;
    z-index: 4;
  }
  button.ai {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  button.ai:hover:not(:disabled) { background: var(--hover); border-color: var(--accent-hover); }
  #aiCard {
    position: fixed;
    top: 62px;
    right: 16px;
    width: 360px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 84px);
    overflow: auto;
    z-index: 40;
    padding: 14px;
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: var(--shadow);
  }
  #aiCard[hidden] { display: none; }
  .ai-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .ai-head b { font-size: 13px; }
  .ai-head .spacer { flex: 1; }

<script>
  /* 美颜工坊和 DSH 同源，又挂在主面板的 iframe 里，所以在 <head> 里直接读宿主的
     --dsw-alias-* 调色板，跟着 DSH 当前主题走（浅色、深色、第三方主题都算），
     不再自己按系统外观猜。脚本在首帧前跑完，不会闪一下别的颜色；单独打开
     （预览、截图、无 DSH 父页面）时整段跳过，继续用上面的 prefers-color-scheme 兜底。 */
  (function () {
    'use strict';
    var TOKENS = [
      '--dsw-alias-bg-base',
      '--dsw-alias-bg-layer-1',
      '--dsw-alias-bg-layer-2',
      '--dsw-alias-border-l1',
      '--dsw-alias-border-l2',
      '--dsw-alias-label-primary',
      '--dsw-alias-label-secondary',
      '--dsw-alias-label-primary-foreground',
      '--dsw-alias-button-info-fill',
      '--dsw-alias-state-error-primary',
      '--dsw-alias-state-success-primary',
      '--dsw-alias-interactive-bg-hover-solid',
      '--dsw-alias-switch-thumb',
      '--dsw-alias-scrollbar-bg-l1'
    ];
    var host = window.parent;
    if (host === window) return;
    var hdoc;
    try { hdoc = host.document; } catch (err) { return; }
    if (!hdoc || !hdoc.documentElement) return;

    var root = document.documentElement;
    var body = null;
    var observer = null;
    var queued = 0;
    var tries = 0;
    var signature = '';

    function source() {
      return hdoc.body || hdoc.documentElement;
    }

    function read(el, name) {
      var value = host.getComputedStyle(el).getPropertyValue(name);
      if (!value && el !== hdoc.documentElement) {
        value = host.getComputedStyle(hdoc.documentElement).getPropertyValue(name);
      }
      return (value || '').trim();
    }

    /* var() 会被 getComputedStyle 解析成实际颜色，color-mix() 不会，所以借宿主
       页面上一个临时隐藏节点，让它的 color 把表达式算成真正的颜色值。 */
    function resolve(name, raw) {
      if (!/var\(|color-mix\(/i.test(raw)) return raw;
      var probe = hdoc.createElement('span');
      probe.setAttribute('aria-hidden', 'true');
      probe.style.cssText = 'position:fixed;left:-9999px;top:0;width:0;height:0;pointer-events:none;all:initial';
      probe.style.color = 'var(' + name + ')';
      source().appendChild(probe);
      try {
        return host.getComputedStyle(probe).color || raw;
      } catch (err) {
        return raw;
      } finally {
        probe.remove();
      }
    }

    function sync() {
      var el = source();
      if (!el) return;
      var scheme = hdoc.body && hdoc.body.hasAttribute('data-ds-dark-theme') ? 'dark' : 'light';
      var values = {};
      var next = scheme + '|';
      for (var i = 0; i < TOKENS.length; i++) {
        var name = TOKENS[i];
        var raw = read(el, name);
        values[name] = raw ? resolve(name, raw) : '';
        next += values[name] + '|';
      }
      if (!values['--dsw-alias-bg-base']) {
        // 宿主还没把主题写上来（首次挂载的瞬间），稍后再试。
        watch();
        if (tries++ < 40) setTimeout(sync, 50);
        return;
      }
      tries = 0;
      if (next === signature) return;
      signature = next;
      root.setAttribute('data-dsh-theme', scheme);
      for (var key in values) {
        if (values[key]) root.style.setProperty(key, values[key]);
        else root.style.removeProperty(key);
      }
      root.style.colorScheme = scheme;
      watch();
    }

    function queue() {
      if (queued) return;
      queued = setTimeout(function () {
        queued = 0;
        sync();
      }, 16);
    }

    /* DSH 切主题时会改 <html> 的 color-scheme 和 <body> 的 data-ds-dark-theme、
       style，跟着这两个节点看就够了。 */
    function watch() {
      if (typeof MutationObserver !== 'function') return;
      var target = hdoc.body;
      if (!target) return;
      if (observer && body === target) return;
      if (observer) observer.disconnect();
      body = target;
      observer = new MutationObserver(queue);
      observer.observe(hdoc.documentElement, {
        attributes: true,
        attributeFilter: ['style', 'class', 'color-scheme']
      });
      observer.observe(target, {
        attributes: true,
        attributeFilter: ['style', 'class', 'data-ds-dark-theme']
      });
    }

    sync();
    // 父页面晚一点才套主题的情况：再补几帧，避免一直停在系统外观上。
    var late = 0;
    (function retry() {
      if (signature || late++ > 40) return;
      setTimeout(retry, 50);
      queue();
    })();
  })();
</script>
</head>

    saveTop: $('saveTopBtn'), compare: $('compareBtn'), reset: $('resetBtn'),
    status: $('status'),
    skinInfo: $('skinInfo'),
    maskBtn: $('maskBrushBtn'), maskHint: $('maskHint'), maskCount: $('maskCount'), maskClear: $('maskClearBtn'),
    wrinkleBtn: $('wrinkleBrushBtn'), wrinkleHint: $('wrinkleHint'), wrinkleCount: $('wrinkleCount'),
    wrinkleClear: $('wrinkleClearBtn'),
    tonePad: $('tonePad'), toneDot: $('toneDot'), toneVal: $('toneVal'), toneReset: $('toneReset'),
    liquidToggle: $('liquifyToggle'), liquidModes: $('liquifyModes'), liquidRadius: $('liquifyRadius'),
    liquidStrength: $('liquifyStrength'), liquidUndo: $('liquifyUndo'), liquidRedo: $('liquifyRedo'),
    liquidClear: $('liquifyClear'), liquidCount: $('liquifyCount'), brush: $('brushCursor'),
    trail: $('liquidTrail'), warp: $('warpCanvas'), liquidRadiusVal: $('liquifyRadiusVal'), liquidStrengthVal: $('liquifyStrengthVal'),
    compareHint: $('compareHint'),
    aiBtn: $('aiBtn'), aiCard: $('aiCard'), aiClose: $('aiClose'), aiSummary: $('aiSummary'),
    aiReasons: $('aiReasons'), aiMetrics: $('aiMetrics'), aiDiff: $('aiDiff'), aiWarnings: $('aiWarnings'),
    aiError: $('aiError'), aiMeta: $('aiMeta'), aiApply: $('aiApply'), aiUndo: $('aiUndo'), aiRetry: $('aiRetry'),
    filmstrip: $('filmstrip'), filmTrack: $('filmTrack'),
    aiDialog: $('aiDialog'), aiDialogNote: $('aiDialogNote'), aiDialogCancel: $('aiDialogCancel'),
    aiDialogCurrent: $('aiDialogCurrent'), aiDialogAll: $('aiDialogAll'),
    exportDialog: $('exportDialog'), exportPick: $('exportPick'), exportWhere: $('exportWhere'),
    exportList: $('exportList'), exportCount: $('exportCount'), exportAll: $('exportAll'),
    exportNone: $('exportNone'), exportNext: $('exportNext'), exportCancel: $('exportCancel'),
    exportBack: $('exportBack'), exportStart: $('exportStart'), exportDir: $('exportDir'),
    exportNote: $('exportNote'), exportResults: $('exportResults'), exportReveal: $('exportReveal'),
    exportDone: $('exportDone'),
  };
  const sliders = ['smooth', 'whiten', 'person', 'wrinkle', 'detail', 'slim', 'eyes', 'shadow', 'liner', 'blush', 'lip'];
  const colours = ['shadowColor', 'linerColor', 'blushColor', 'lipColor'];
  const COLOUR_KEY = 'dsh-beauty.colours.v1';

  /** Remember the last chosen makeup colours (item: 颜色按上次选择). */
  function loadColours() {
    const out = {};
    try {
      const raw = JSON.parse(localStorage.getItem(COLOUR_KEY) || '{}');
      for (const key of colours) {
        if (typeof raw[key] === 'string' && /^#[0-9a-f]{6}$/i.test(raw[key])) out[key] = raw[key].toLowerCase();
      }
    } catch {}
    return out;
  }

  function rememberColours() {
    try {
      const data = {};
      for (const key of colours) data[key] = $(key).value;
      localStorage.setItem(COLOUR_KEY, JSON.stringify(data));
    } catch {}
  }
  // The engine reports snake_case; the panel talks camelCase.
  const SNAKE = { shadow_color: 'shadowColor', liner_color: 'linerColor', blush_color: 'blushColor', lip_color: 'lipColor' };
  const DEFAULTS = {
    smooth: 25, whiten: 12, person: 0, wrinkle: 0, temperature: 0, tint: 0, detail: 0.35, slim: 10, eyes: 8,
    shadow: 0, liner: 0, blush: 0, lip: 0,
    shadowColor: '#a97b8c', linerColor: '#2a211f', blushColor: '#e2827e', lipColor: '#b4404f',
    ...loadColours(),
  };
  // Four clearly different looks: barely-there, soft-glow, polished and
  // evening. Every preset carries its own makeup and skin-tone position.
  const PRESETS = {
    natural: {
      smooth: 18, whiten: 8, person: 0, temperature: 4, tint: 0, detail: 0.45, slim: 6, eyes: 4,
      shadow: 6, shadowColor: '#b3908b', liner: 0, linerColor: '#3a2c28', blush: 8, blushColor: '#e7a49a', lip: 18, lipColor: '#b97478',
    },
    glow: {
      smooth: 42, whiten: 28, person: 24, temperature: 10, tint: 3, detail: 0.25, slim: 8, eyes: 10,
      shadow: 16, shadowColor: '#c79a9a', liner: 8, linerColor: '#4a3530', blush: 28, blushColor: '#f2a79f', lip: 40, lipColor: '#cf7f86',
    },
    refined: {
      smooth: 38, whiten: 16, person: 10, temperature: 2, tint: 1, detail: 0.35, slim: 26, eyes: 18,
      shadow: 24, shadowColor: '#a8828c', liner: 30, linerColor: '#2b2224', blush: 18, blushColor: '#dd8f8d', lip: 38, lipColor: '#b2595f',
    },
    evening: {
      smooth: 30, whiten: 10, person: 10, temperature: -2, tint: -2, detail: 0.3, slim: 18, eyes: 14,
      shadow: 58, shadowColor: '#8b6478', liner: 52, linerColor: '#241b1a', blush: 34, blushColor: '#d9736f', lip: 80, lipColor: '#a3243f',
    },
  };

  const state = {
    /** Every imported photo, each with its own params, strokes, zoom and thumb. */
    images: [],
    active: -1,
    batch: false,
    exportSelected: new Set(),
    exportDir: '',
    exporting: false,
    picking: false,
    sourceId: null,
    sourceName: '',
    params: { ...DEFAULTS },
    tone: { temperature: 0, tint: 0 },
    seq: 0,
    timer: 0,
    controller: null,
    busy: false,
    zoom: 1,
    panX: 0,
    panY: 0,
    drag: null,
    source: { width: 0, height: 0 },
    preview: { width: 0, height: 0 },
    crop: { rect: '', box: null, key: '', url: '', seq: 0, timer: 0 },
    orig: { rect: '', box: null, url: '', seq: 0 },
    liquid: { on: false, mode: 'push', radius: 0.06, strength: 0.55, strokes: [], redo: [], drawing: null },
    mask: { on: false, radius: 0.03, strokes: [], drawing: null },
    wrinkle: { on: false, radius: 0.015, strokes: [], drawing: null },
    tonePointer: null,
    ai: { loading: false, controller: null, suggestion: null, metrics: null, snapshot: null, undo: null, meta: null },
    missingSource: false,
  };

  // ---- multi-image model -----------------------------------------------
  // One entry per imported photo; the sliders, strokes, zoom and last preview
  // all live on the entry, so switching images restores that photo's edit.
  function defaultParams() {
    return { ...DEFAULTS, liquify: [], maskStrokes: [], wrinkleStrokes: [] };
  }

  function cleanParams(raw) {
    const source = raw && typeof raw === 'object' ? raw : {};
    const params = {};
    for (const key of sliders) {
      params[key] = boundedNumber(source[key], 0, key === 'detail' ? 1 : 100, Number(DEFAULTS[key]));
    }
    params.temperature = boundedNumber(source.temperature, -50, 50, 0);
    params.tint = boundedNumber(source.tint, -50, 50, 0);
    for (const key of colours) {
      params[key] = typeof source[key] === 'string' && /^#[0-9a-f]{6}$/i.test(source[key])
        ? source[key].toLowerCase()
        : DEFAULTS[key];
    }
    params.liquify = cleanStrokes(source.liquify, true);
    params.maskStrokes = cleanStrokes(source.maskStrokes, false);
    params.wrinkleStrokes = cleanStrokes(source.wrinkleStrokes, false);
    return params;
  }

  /** Stable key for "is this preview still exactly these params?". */
  function paramsKeyLocal(raw) {
    const params = cleanParams(raw);
    const keys = Object.keys(params).sort();
    return JSON.stringify(keys.map((key) => [key, params[key]]));
  }

  function entryFor(id) {
    return state.images.find((entry) => entry.id === id) || null;
  }

  function activeEntry() {
    return state.images[state.active] || null;
  }

  function createEntry(id, name, params) {
    return {
      id,
      name: name || '',
      params: cleanParams(params || defaultParams()),
      view: { zoom: 1, panX: 0, panY: 0 },
      thumb: '',
      previewUrl: '',
      previewKey: '',
      badge: '',
      source: { width: 0, height: 0 },
      preview: { width: 0, height: 0 },
    };
  }

  function thumbUrlFor(entry) {
    if (entry.thumb) return entry.thumb;
    return '/api/dsh-beauty/thumb?id=' + encodeURIComponent(entry.id) + '&w=240';
  }

  /** A rendered tile can be pruned from the cache: fall back to the original. */
  function attachThumbFallback(img, entry) {
    img.addEventListener('error', () => {
      if (!entry.thumb) return;
      entry.thumb = '';
      img.src = thumbUrlFor(entry);
    });
  }

  /** `/render-file?id=ren_…` → a small JPEG of the edited preview. */
  function thumbForRender(url) {
    try {
      const id = new URL(url, location.href).searchParams.get('id');
      if (id && /^ren_[a-f0-9]{12}_[a-z0-9]+\.jpg$/.test(id)) {
        return '/api/dsh-beauty/thumb?ren=' + encodeURIComponent(id) + '&w=240';
      }
    } catch {}
    return '';
  }

  function looksLikeImage(file) {
    return /^image\//.test(file.type || '') || /\.(jpe?g|png|webp|heic|heif)$/i.test(file.name || '');
  }

  // ---- session persistence ---------------------------------------------
  // DSH only keeps the active main panel mounted: opening another sidebar page
  // destroys this iframe, and with it every bit of JS state. Keep a tab-scoped
  // snapshot in sessionStorage so coming back restores every photo and edit.
  const SESSION_KEY = 'dsh-beauty.session.v2';
  const SESSION_KEY_V1 = 'dsh-beauty.session.v1';
  const SESSION_MODES = ['push', 'bloat', 'pucker'];
  const SESSION_MAX_STROKES = 400;
  const SESSION_MAX_IMAGES = 60;
  let sessionTimer = 0;
  let sessionReady = false;

  function boundedNumber(value, min, max, fallback) {
    const number = Number(value);
    if (!Number.isFinite(number)) return fallback;
    return Math.max(min, Math.min(max, number));
  }

  function cleanStrokes(raw, withMode) {
    if (!Array.isArray(raw)) return [];
    const out = [];
    for (const item of raw.slice(-SESSION_MAX_STROKES)) {
      if (!item || !Array.isArray(item.points)) continue;
      const points = [];
      for (const point of item.points.slice(0, 512)) {
        if (!Array.isArray(point)) continue;
        const x = Number(point[0]);
        const y = Number(point[1]);
        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        points.push([Math.max(0, Math.min(1, x)), Math.max(0, Math.min(1, y))]);
      }
      if (!points.length) continue;
      if (withMode) {
        // A single click is a valid bloat/pucker stroke; push needs a drag.
        const mode = SESSION_MODES.includes(item.mode) ? item.mode : 'push';
        if (mode === 'push' && points.length < 2) continue;
        out.push({
          mode,
          radius: boundedNumber(item.radius, 0.004, 0.6, 0.06),
          strength: boundedNumber(item.strength, 0.02, 1, 0.55),
          points,
        });
      } else {
        out.push({ radius: boundedNumber(item.radius, 0.002, 0.4, 0.03), points });
      }
    }
    return out;
  }

  /** Fold the live sliders/strokes/view back into the active photo entry. */
  function captureActive() {
    const entry = activeEntry();
    if (!entry) return;
    entry.params = cleanParams(readParams());
    entry.view = { zoom: state.zoom, panX: state.panX, panY: state.panY };
  }

  /** Write the whole workbench synchronously. Safe when nothing is open. */
  function saveSession() {
    clearTimeout(sessionTimer);
    sessionTimer = 0;
    if (!sessionReady || !state.images.length) return;
    captureActive();
    const snapshot = {
      v: 2,
      activeId: state.sourceId,
      // Preview URLs are not part of the snapshot: cache files can be pruned
      // between sessions, so a restored photo always renders once.
      images: state.images.slice(0, SESSION_MAX_IMAGES).map((entry) => ({
        id: entry.id,
        name: entry.name,
        params: cleanParams(entry.params),
        view: { zoom: entry.view.zoom, panX: entry.view.panX, panY: entry.view.panY },
      })),
      liquid: { mode: state.liquid.mode, radius: state.liquid.radius, strength: state.liquid.strength },
      mask: { radius: state.mask.radius },
      wrinkle: { radius: state.wrinkle.radius },
      savedAt: Date.now(),
    };
    try {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(snapshot));
    } catch {
      // Very long stroke lists can hit the 5 MB sessionStorage quota. Trim the
      // oldest strokes on every photo, keeping every scalar.
      for (const entry of snapshot.images) {
        for (const key of ['liquify', 'maskStrokes', 'wrinkleStrokes']) {
          entry.params[key] = entry.params[key].slice(-40);
        }
      }
      try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(snapshot)); } catch {}
    }
    // The v1 key was only needed until the first v2 snapshot was written.
    try { sessionStorage.removeItem(SESSION_KEY_V1); } catch {}
  }

  function scheduleSessionSave(delay) {
    if (!sessionReady || !state.images.length) return;
    clearTimeout(sessionTimer);
    sessionTimer = setTimeout(saveSession, delay === undefined ? 220 : delay);
  }

  function sessionEntry(raw) {
    if (!raw || typeof raw !== 'object') return null;
    if (typeof raw.id !== 'string' || !/^src_[0-9a-f]{20}$/.test(raw.id)) return null;
    const entry = createEntry(raw.id, typeof raw.name === 'string' ? raw.name : '', raw.params);
    const view = raw.view && typeof raw.view === 'object' ? raw.view : {};
    entry.view = {
      zoom: boundedNumber(view.zoom, 1, 8, 1),
      panX: boundedNumber(view.panX, -1000000, 1000000, 0),
      panY: boundedNumber(view.panY, -1000000, 1000000, 0),
    };
    return entry;
  }

  function readSession() {
    try {
      const raw = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
      if (raw && raw.v === 2 && Array.isArray(raw.images)) {
        const images = raw.images.map(sessionEntry).filter(Boolean).slice(0, SESSION_MAX_IMAGES);
        if (!images.length) return null;
        return { ...raw, images };
      }
      // One-photo snapshot from the previous version: lift it into the list.
      const old = JSON.parse(sessionStorage.getItem(SESSION_KEY_V1) || 'null');
      if (!old || old.v !== 1) return null;
      const entry = sessionEntry({
        id: old.sourceId,
        name: old.sourceName,
        params: old.params,
        view: old.view,
      });
      if (!entry) return null;
      return { v: 2, activeId: entry.id, images: [entry], liquid: old.liquid, mask: old.mask, wrinkle: old.wrinkle };
    } catch {
      return null;
    }
  }

  function clearSession() {
    clearTimeout(sessionTimer);
    sessionTimer = 0;
    try { sessionStorage.removeItem(SESSION_KEY); } catch {}
    try { sessionStorage.removeItem(SESSION_KEY_V1); } catch {}
  }

  function adoptSource(id) {
    state.sourceId = id;
    state.source = { width: 0, height: 0 };
    state.preview = { width: 0, height: 0 };
    hideZoom();
    els.before.src = '/api/dsh-beauty/source?id=' + encodeURIComponent(id);
    els.wrap.classList.add('on');
    els.drop.style.display = 'none';
    setSaveDisabled();
  }

  function discardSession() {
    clearSession();
    // Kill any preview still in flight for the photos being dropped: its
    // response must not paint the stage after the workbench is cleared.
    if (state.controller) {
      try { state.controller.abort(); } catch {}
      state.controller = null;
    }
    state.seq += 1;
    state.images = [];
    state.active = -1;
    state.sourceId = null;
    state.sourceName = '';
    state.liquid.on = false;
    state.liquid.strokes = [];
    state.liquid.redo = [];
    state.mask.on = false;
    state.mask.strokes = [];
    state.wrinkle.on = false;
    state.wrinkle.strokes = [];
    state.zoom = 1;
    state.panX = 0;
    state.panY = 0;
    renderFilmstrip();
    applyZoom();
    els.before.removeAttribute('src');
    els.after.removeAttribute('src');
    els.wrap.classList.remove('on');
    els.drop.style.display = '';
    setSaveDisabled();
    updateLiquidUI();
    updateMaskUI();
    updateWrinkleUI();
    syncLabels();
  }

  async function restoreSession(snapshot) {
    state.images = snapshot.images.map(sessionEntry).filter(Boolean);
    if (!state.images.length) {
      discardSession();
      return;
    }
    const liquid = snapshot.liquid && typeof snapshot.liquid === 'object' ? snapshot.liquid : {};
    const mask = snapshot.mask && typeof snapshot.mask === 'object' ? snapshot.mask : {};
    const wrinkle = snapshot.wrinkle && typeof snapshot.wrinkle === 'object' ? snapshot.wrinkle : {};
    state.liquid.mode = SESSION_MODES.includes(liquid.mode) ? liquid.mode : 'push';
    state.liquid.radius = boundedNumber(liquid.radius, 0.005, 0.6, 0.06);
    state.liquid.strength = boundedNumber(liquid.strength, 0.02, 1, 0.55);
    state.liquid.redo = [];
    state.mask.radius = boundedNumber(mask.radius, 0.006, 0.2, 0.03);
    state.wrinkle.radius = boundedNumber(wrinkle.radius, 0.001, 0.12, 0.015);
    els.liquidToggle.checked = false;
    els.liquidRadius.value = String(state.liquid.radius * 100);
    els.liquidStrength.value = String(state.liquid.strength * 100);
    renderFilmstrip();
    updateLiquidUI();
    updateMaskUI();
    updateWrinkleUI();
    let index = state.images.findIndex((entry) => entry.id === snapshot.activeId);
    if (index < 0) index = 0;
    setStatus('正在恢复上次的编辑…');
    const ok = await loadImageAt(index, { skipCapture: true, force: true });
    if (!ok) {
      if (!state.images.length) {
        discardSession();
        setStatus('上次的照片缓存已失效，请重新打开一张照片', 'err');
      }
      return;
    }
    setStatus(
      state.images.length > 1 ? `已恢复 ${state.images.length} 张图片的上次编辑` : '已恢复上次的编辑',
      'ok',
    );
  }

  // ---- filmstrip -------------------------------------------------------
  function renderFilmstrip() {
    const has = state.images.length > 0;
    els.filmstrip.hidden = !has;
    els.compareHint.hidden = !has;
    document.body.classList.toggle('has-film', has);
    els.filmTrack.replaceChildren(...state.images.map((entry, index) => filmItem(entry, index)));
    updateFilmActive();
  }

  function filmItem(entry, index) {
    const item = document.createElement('div');
    item.className = 'film-item';
    item.setAttribute('role', 'listitem');
    item.dataset.id = entry.id;
    item.tabIndex = 0;
    item.draggable = false;
    item.title = `第 ${index + 1} 张`;
    item.setAttribute('aria-label', `第 ${index + 1} 张`);
    const img = document.createElement('img');
    img.src = thumbUrlFor(entry);
    attachThumbFallback(img, entry);
    img.alt = '';
    img.loading = 'lazy';
    img.draggable = false;
    const number = document.createElement('span');
    number.className = 'film-index';
    number.textContent = String(index + 1);
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'film-x';
    remove.title = '从列表中移除';
    remove.setAttribute('aria-label', `移除第 ${index + 1} 张`);
    remove.textContent = '×';
    item.append(img, number, remove);
    return item;
  }

  function updateFilmActive() {
    for (const item of els.filmTrack.querySelectorAll('.film-item')) {
      const on = item.dataset.id === state.sourceId;
      item.classList.toggle('on', on);
      if (on) item.setAttribute('aria-current', 'true');
      else item.removeAttribute('aria-current');
    }
  }

  function refreshFilmItem(entry) {
    const item = els.filmTrack.querySelector('.film-item[data-id="' + entry.id + '"]');
    const img = item && item.querySelector('img');
    if (img) img.src = thumbUrlFor(entry);
  }

  function selectImage(id) {
    if (state.batch || state.exporting) return;
    const index = state.images.findIndex((entry) => entry.id === id);
    if (index < 0 || index === state.active) return;
    loadImageAt(index).catch((error) => setStatus(String(error.message || error), 'err'));
  }

  function removeImage(id) {
    if (state.batch || state.exporting) return;
    const index = state.images.findIndex((entry) => entry.id === id);
    if (index < 0) return;
    const wasActive = state.active === index;
    state.images.splice(index, 1);
    if (state.active > index) state.active -= 1;
    else if (wasActive) state.active = -1;
    state.exportSelected.delete(id);
    renderFilmstrip();
    if (!state.images.length) {
      discardSession();
      setStatus('图片已全部移除');
      return;
    }
    saveSession();
    if (wasActive) {
      const next = Math.min(index, state.images.length - 1);
      loadImageAt(next, { skipCapture: true }).catch(() => {});
    }
  }

  // ---- switching images ------------------------------------------------
  function applyEntryParams(entry) {
    const params = cleanParams(entry.params);
    state.liquid.strokes = cleanStrokes(params.liquify, true);
    state.liquid.redo = [];
    state.mask.strokes = cleanStrokes(params.maskStrokes, false);
    state.wrinkle.strokes = cleanStrokes(params.wrinkleStrokes, false);
    state.liquid.on = false;
    state.mask.on = false;
    state.wrinkle.on = false;
    els.liquidToggle.checked = false;
    els.maskBtn.classList.remove('on');
    els.maskBtn.setAttribute('aria-pressed', 'false');
    els.wrinkleBtn.classList.remove('on');
    els.wrinkleBtn.setAttribute('aria-pressed', 'false');
    clearTimeout(state.crop.timer);
    state.crop = { rect: '', box: null, key: '', url: '', seq: 0, timer: 0 };
    state.orig = { rect: '', box: null, url: '', seq: 0 };
    els.zoomAfter.removeAttribute('src');
    els.zoomBefore.removeAttribute('src');
    els.skinInfo.textContent = '';
    applyParams(params, true);
    updateLiquidUI();
    updateMaskUI();
    updateWrinkleUI();
  }

  function restoreEntryView(entry) {
    const view = entry.view || {};
    state.zoom = boundedNumber(view.zoom, 1, 8, 1);
    state.panX = boundedNumber(view.panX, -1000000, 1000000, 0);
    state.panY = boundedNumber(view.panY, -1000000, 1000000, 0);
    applyZoom();
  }

  async function loadImageAt(index, options) {
    const opts = options || {};
    const entry = state.images[index];
    if (!entry) return false;
    const previous = activeEntry();
    if (!opts.skipCapture && previous && previous !== entry) captureActive();
    if (state.controller) {
      try { state.controller.abort(); } catch {}
    }
    state.seq += 1;
    state.active = index;
    state.sourceId = entry.id;
    state.sourceName = entry.name;
    state.zoom = 1;
    state.panX = 0;
    state.panY = 0;
    clearAi(true);
    adoptSource(entry.id);
    applyEntryParams(entry);
    updateFilmActive();
    els.wrap.classList.add('on');
    const key = paramsKeyLocal(entry.params);
    if (!opts.force && entry.previewUrl && entry.previewKey === key) {
      // The last preview for this photo still matches its params: show it
      // immediately and skip a redundant engine run.
      els.after.src = entry.previewUrl;
      try { await els.after.decode(); } catch {}
      state.source = { ...(entry.source || { width: 0, height: 0 }) };
      state.preview = { ...(entry.preview || { width: 0, height: 0 }) };
      els.badge.textContent = entry.badge || '';
      els.badge.style.display = entry.badge ? 'block' : 'none';
      state.crop.key = '';
      restoreEntryView(entry);
      scheduleZoom(0);
      saveSession();
      setStatus('已切换到 ' + (entry.name || '这张图片'));
      return true;
    }
    const ok = await render({ immediate: true });
    if (!ok && state.missingSource) {
      setStatus('「' + (entry.name || '这张图片') + '」的缓存已失效，已从列表移除', 'err');
      removeImage(entry.id);
      return false;
    }
    if (ok) restoreEntryView(entry);
    saveSession();
    return ok;
  }

  function setStatus(text, kind) {
    els.status.textContent = text;
    els.status.className = kind || '';
  }

  function readParams() {
    return {
      smooth: Number($('smooth').value),
      whiten: Number($('whiten').value),
      person: Number($('person').value),
      wrinkle: Number($('wrinkle').value),
      temperature: state.tone.temperature,
      tint: state.tone.tint,
      detail: Number($('detail').value),
      slim: Number($('slim').value),
      eyes: Number($('eyes').value),
      shadow: Number($('shadow').value),
      liner: Number($('liner').value),
      blush: Number($('blush').value),
      lip: Number($('lip').value),
      shadowColor: $('shadowColor').value,
      linerColor: $('linerColor').value,
      blushColor: $('blushColor').value,
      lipColor: $('lipColor').value,
      // Strokes are stored in source-normalised coordinates, so the same list
      // works for the capped preview, the 1:1 crops and the full-res save.
      liquify: state.liquid.strokes.map((stroke) => ({
        mode: stroke.mode,
        radius: stroke.radius,
        strength: stroke.strength,
        points: stroke.points.map((point) => [point[0], point[1]]),
      })),
      // Manual skin mask: painted areas join the subject mask in the engine.
      maskStrokes: state.mask.strokes.map((stroke) => ({
        radius: stroke.radius,
        points: stroke.points.map((point) => [point[0], point[1]]),
      })),
      // Wrinkle brush: painted areas get their creases flattened.
      wrinkleStrokes: state.wrinkle.strokes.map((stroke) => ({
        radius: stroke.radius,
        points: stroke.points.map((point) => [point[0], point[1]]),
      })),
    };
  }

  function syncLabels() {
    for (const key of sliders) {
      const out = $(key + 'Val');
      if (out) out.textContent = key === 'detail' ? Number($(key).value).toFixed(2) : String(Math.round(Number($(key).value)));
    }
  }

  // 色温/色调读成“暖 +6 · 洋红 +3”这种人话；两边都归零就是中性。
  function toneText(temperature, tint) {
    const parts = [];
    if (temperature > 0) parts.push(`暖 +${temperature}`);
    else if (temperature < 0) parts.push(`冷 ${temperature}`);
    if (tint > 0) parts.push(`洋红 +${tint}`);
    else if (tint < 0) parts.push(`绿 ${tint}`);
    return parts.length > 0 ? parts.join(' · ') : '中性';
  }

  function setTone(temperature, tint, options) {
    const opts = options || {};
    const temp = Math.max(-50, Math.min(50, Math.round(Number(temperature) || 0)));
    const tin = Math.max(-50, Math.min(50, Math.round(Number(tint) || 0)));
    state.tone = { temperature: temp, tint: tin };
    if (els.toneDot) {
      els.toneDot.style.left = `${(tin + 50) / 100 * 100}%`;
      els.toneDot.style.top = `${(50 - temp) / 100 * 100}%`;
    }
    const text = toneText(temp, tin);
    if (els.toneVal) els.toneVal.textContent = text;
    if (els.tonePad) {
      els.tonePad.setAttribute(
        'aria-label',
        `整体肤色：${text}。上下调色温，左右调色调；方向键微调，Shift 加速，双击归零`,
      );
    }
    if (opts.commit) schedule(60);
  }

  function applyParams(rawParams, updateSliders) {
    const params = {};
    for (const [key, value] of Object.entries(rawParams || {})) params[SNAKE[key] || key] = value;
    state.params = { ...state.params, ...params };
    for (const key of sliders) {
      if (typeof params[key] === 'number') {
        const input = $(key);
        if (updateSliders) input.value = String(params[key]);
      }
    }
    for (const key of colours) {
      if (typeof params[key] === 'string' && /^#[0-9a-f]{6}$/i.test(params[key])) {
        const input = $(key);
        if (updateSliders) input.value = params[key];
      }
    }
    if (updateSliders) {
      // Older saved params only speak `warmth`; treat it as temperature so the
      // pad lands where the photo already is instead of snapping to centre.
      const legacy = typeof (rawParams || {}).warmth === 'number' ? rawParams.warmth : undefined;
      const temperature = typeof params.temperature === 'number' ? params.temperature : legacy;
      const tint = typeof params.tint === 'number' ? params.tint : undefined;
      if (temperature !== undefined || tint !== undefined) {
        setTone(
          temperature === undefined ? state.tone.temperature : temperature,
          tint === undefined ? state.tone.tint : tint,
          { commit: false },
        );
      }
    }
    syncLabels();
  }

  function setBusy(on, text) {
    state.busy = on;
    els.busy.classList.toggle('on', on);
    if (text) els.busyText.textContent = text;
  }

  async function uploadOne(file) {
    const data = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
    const response = await fetch('/api/dsh-beauty/upload', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ name: file.name || 'photo.jpg', data }),
    });
    const body = await response.json().catch(() => null);
    if (!response.ok || !body || body.ok !== true) {
      throw new Error((body && body.error && body.error.message) || `上传失败：${file.name || '图片'}`);
    }
    return createEntry(body.id, body.name || file.name || '', defaultParams());
  }

  /**
   * Import one or more picked/dropped/pasted files, then show the first new one.
   *
   * A new import starts a new batch: the photos open before it are dropped
   * once at least one file uploads. Appending used to keep last session's
   * photo in the strip, so removing every imported photo made that older
   * photo pop back as if the workbench had not been replaced.
   */
  async function uploadFiles(files) {
    const list = Array.from(files || []).filter(looksLikeImage);
    if (!list.length) {
      setStatus(files && files.length ? '这些文件不是图片' : '没有选择图片', 'err');
      return;
    }
    if (state.batch || state.exporting) return;
    let failed = 0;
    const imported = [];
    setBusy(true, `载入中 1/${list.length}…`);
    setStatus(`载入中 1/${list.length}…`);
    for (let index = 0; index < list.length; index += 1) {
      if (index > 0) {
        els.busyText.textContent = `载入中 ${index + 1}/${list.length}…`;
        setStatus(`载入中 ${index + 1}/${list.length}…`);
      }
      try {
        imported.push(await uploadOne(list[index]));
      } catch (error) {
        failed += 1;
      }
    }
    setBusy(false);
    // A failed import keeps the current batch: nothing is dropped until at
    // least one file made it in.
    if (!imported.length) {
      setStatus(failed ? `导入失败（${failed} 张）` : '导入失败', 'err');
      return;
    }
    discardSession();
    state.images = imported;
    renderFilmstrip();
    await loadImageAt(0);
    // The photos can be removed again while that first preview renders; keep
    // that outcome instead of overwriting it with the import summary.
    if (state.images.length) {
      setStatus(
        `已导入 ${imported.length} 张图片${failed ? `，${failed} 张失败` : ''}`,
        failed ? 'err' : 'ok',
      );
    }
  }

  // ---- zoom & pan ------------------------------------------------------
  // The wrap keeps its layout box; zoom/pan live entirely in a CSS transform so
  // the before/after pair stays pixel-aligned.
  function applyZoom() {
    const active =
      Math.abs(state.zoom - 1) > 0.001 || Math.abs(state.panX) > 0.5 || Math.abs(state.panY) > 0.5;
    els.wrap.style.transform = active
      ? `translate(${state.panX.toFixed(2)}px, ${state.panY.toFixed(2)}px) scale(${state.zoom.toFixed(4)})`
      : '';
    els.wrap.classList.toggle('zoomed', state.zoom > 1.001);
    els.zoomBadge.textContent = Math.round(state.zoom * 100) + '%';
    els.zoomBadge.style.display = state.zoom > 1.001 ? 'block' : 'none';
    placeZoom();
    scheduleZoom();
    scheduleSessionSave(350);
  }

  function clampPan() {
    if (state.zoom <= 1.001) {
      state.panX = 0;
      state.panY = 0;
      return;
    }
    const width = els.wrap.offsetWidth;
    const height = els.wrap.offsetHeight;
    const maxX = (width * (state.zoom - 1)) / 2 + 24;
    const maxY = (height * (state.zoom - 1)) / 2 + 24;
    state.panX = Math.max(-maxX, Math.min(maxX, state.panX));
    state.panY = Math.max(-maxY, Math.min(maxY, state.panY));
  }

  function resetZoom() {
    state.zoom = 1;
    state.panX = 0;
    state.panY = 0;
    applyZoom();
  }

  /** Zoom around a viewport point so whatever sits under the cursor stays put. */
  function zoomAt(clientX, clientY, factor) {
    if (!els.wrap.classList.contains('on')) return;
    const rect = els.wrap.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const from = state.zoom;
    const to = Math.min(8, Math.max(1, from * factor));
    if (Math.abs(to - from) < 0.0005) return;
    const centreX = rect.left + rect.width / 2;
    const centreY = rect.top + rect.height / 2;
    // Cursor position in unscaled element pixels, relative to the element centre.
    const offX = (clientX - centreX) / from;
    const offY = (clientY - centreY) / from;
    const fromX = state.panX;
    const fromY = state.panY;
    state.zoom = to;
    state.panX = clientX - offX * to - centreX + fromX;
    state.panY = clientY - offY * to - centreY + fromY;
    clampPan();
    applyZoom();
  }

  // ---- screen-space 1:1 crops ------------------------------------------
  // The base preview is capped at PREVIEW_LONG_SIDE, so past ~150% its pixels get
  // stretched. The crops must be drawn OUTSIDE .preview-wrap: the wrap is scaled
  // with a CSS transform, and the browser rasterises everything inside it at the
  // layout size before filtering that raster up — a native-resolution crop placed
  // inside would come out exactly as soft as the preview. #zoomLayer is
  // positioned in screen pixels over the preview and clipped to it, so the crop is
  // rasterised at the size it is actually drawn, like a normal image viewer.
  const ZOOM_MIN_DENSITY = 1.5; // device px per preview px before a crop is worth it
  const ZOOM_SLACK = 0.15;      // source margin kept around the viewport for drags
  const ZOOM_CROP_LIMIT = 2600; // longest side sent to the host (render cost bound)

  /** Device pixels the preview bitmap currently spends per own pixel. */
  function previewDensity() {
    if (!state.preview.width) return 0;
    const width = els.after.getBoundingClientRect().width;
    return (width * (window.devicePixelRatio || 1)) / state.preview.width;
  }

  function hideZoom() {
    clearTimeout(state.crop.timer);
    state.crop.seq += 1;
    state.orig.seq += 1;
    state.crop.rect = '';
    state.crop.key = '';
    state.crop.box = null;
    state.orig.box = null;
    for (const slot of [state.crop, state.orig]) {
      if (slot.url) {
        URL.revokeObjectURL(slot.url);
        slot.url = '';
      }
    }
    for (const img of [els.zoomAfter, els.zoomBefore]) {
      img.style.display = 'none';
      img.removeAttribute('src');
    }
    els.zoomLayer.style.display = 'none';
  }

  /** Source-pixel rectangle the viewport is showing now (plus slack). */
  function visibleSourceRect() {
    const { width: sw, height: sh } = state.source;
    if (!sw || !sh || state.zoom <= 1.001) return null;
    const wr = els.wrap.getBoundingClientRect();
    const sr = els.stage.getBoundingClientRect();
    if (!wr.width || !wr.height) return null;
    const left = Math.max(wr.left, sr.left);
    const top = Math.max(wr.top, sr.top);
    const right = Math.min(wr.right, sr.right);
    const bottom = Math.min(wr.bottom, sr.bottom);
    if (right - left < 8 || bottom - top < 8) return null;
    // wr carries the CSS scale, so these ratios already include the zoom.
    const kx = sw / wr.width;
    const ky = sh / wr.height;
    let w = Math.ceil((right - left) * kx);
    let h = Math.ceil((bottom - top) * ky);
    let x = Math.floor((left - wr.left) * kx);
    let y = Math.floor((top - wr.top) * ky);
    const padX = Math.round(w * ZOOM_SLACK);
    const padY = Math.round(h * ZOOM_SLACK);
    x -= padX;
    y -= padY;
    w += padX * 2;
    h += padY * 2;
    // Keep the render cheap; the host also caps the long side at 2600.
    const long = Math.max(w, h);
    if (long > ZOOM_CROP_LIMIT) {
      const k = ZOOM_CROP_LIMIT / long;
      const midX = x + w / 2;
      const midY = y + h / 2;
      w = Math.round(w * k);
      h = Math.round(h * k);
      x = Math.round(midX - w / 2);
      y = Math.round(midY - h / 2);
    }
    x = Math.max(0, Math.min(sw - 8, x));
    y = Math.max(0, Math.min(sh - 8, y));
    w = Math.min(sw - x, Math.max(8, w));
    h = Math.min(sh - y, Math.max(8, h));
    return [x, y, w, h];
  }

  /** Put #zoomLayer over the drawn preview so crops are clipped to it. */
  function placeZoom() {
    const ar = els.after.getBoundingClientRect();
    const sr = els.stage.getBoundingClientRect();
    if (!ar.width || !ar.height || !state.source.width) return;
    els.zoomLayer.style.left = (ar.left - sr.left).toFixed(2) + 'px';
    els.zoomLayer.style.top = (ar.top - sr.top).toFixed(2) + 'px';
    els.zoomLayer.style.width = ar.width.toFixed(2) + 'px';
    els.zoomLayer.style.height = ar.height.toFixed(2) + 'px';
    const kx = ar.width / state.source.width;
    const ky = ar.height / state.source.height;
    placeCrop(els.zoomAfter, state.crop.box, kx, ky);
    placeCrop(els.zoomBefore, state.orig.box, kx, ky);
  }

  function placeCrop(img, box, kx, ky) {
    if (!box) {
      img.style.display = 'none';
      return;
    }
    img.style.left = (box[0] * kx).toFixed(2) + 'px';
    img.style.top = (box[1] * ky).toFixed(2) + 'px';
    img.style.width = (box[2] * kx).toFixed(2) + 'px';
    img.style.height = (box[3] * ky).toFixed(2) + 'px';
  }

  function scheduleZoom(delay) {
    clearTimeout(state.crop.timer);
    state.crop.timer = setTimeout(loadZoom, delay === undefined ? 220 : delay);
  }

  async function fetchCrop(rect, mode) {
    const slot = mode === 'original' ? state.orig : state.crop;
    const seq = ++slot.seq;
    const params = mode === 'original' ? {} : readParams();
    const response = await fetch('/api/dsh-beauty/detail', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ id: state.sourceId, rect, params, mode }),
    });
    if (!response.ok || seq !== slot.seq) return null;
    const blob = await response.blob();
    if (seq !== slot.seq) return null;
    const url = URL.createObjectURL(blob);
    if (slot.url) URL.revokeObjectURL(slot.url);
    slot.url = url;
    slot.rect = rect.join(',');
    slot.box = rect;
    return url;
  }

  async function loadZoom() {
    if (!state.sourceId || state.drag || state.liquid.drawing || previewDensity() < ZOOM_MIN_DENSITY) {
      hideZoom();
      return;
    }
    const rect = visibleSourceRect();
    if (!rect) {
      hideZoom();
      return;
    }
    const params = readParams();
    const key = rect.join(',') + '|' + JSON.stringify(params);
    if (key === state.crop.key) return;
    state.crop.key = key;
    try {
      const url = await fetchCrop(rect, 'patched');
      if (!url) return;
      els.zoomLayer.style.display = 'block';
      els.zoomAfter.src = url;
      els.zoomAfter.style.display = 'block';
      placeZoom();
      // Warm the original crop so holding 对比原图 is instant.
      fetchCrop(rect, 'original').then((url2) => {
        if (!url2) return;
        els.zoomBefore.src = url2;
        placeZoom();
      }).catch(() => {});
    } catch {}
  }

  /** True while the screen-space crops are the thing on screen. */
  function zoomLayerActive() {
    return els.zoomLayer.style.display === 'block' && !!els.zoomAfter.getAttribute('src');
  }

  function schedule(delay) {
    if (state.batch) return;
    clearTimeout(state.timer);
    state.timer = setTimeout(() => render(), delay === undefined ? 190 : delay);
    scheduleSessionSave(300);
  }

  async function render(options) {
    if (!state.sourceId || state.batch) return false;
    const seq = ++state.seq;
    if (state.controller) {
      try { state.controller.abort(); } catch {}
    }
    const controller = new AbortController();
    state.controller = controller;
    state.missingSource = false;
    setBusy(true, '处理中…');
    setStatus('处理中…');
    try {
      const response = await fetch('/api/dsh-beauty/render', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        credentials: 'same-origin',
        signal: controller.signal,
        body: JSON.stringify({ id: state.sourceId, params: readParams(), preview: true }),
      });
      const body = await response.json().catch(() => null);
      if (seq !== state.seq) return false;
      if (!response.ok || !body || body.ok !== true) {
        const error = new Error((body && body.error && body.error.message) || '处理失败');
        error.status = response.status;
        throw error;
      }
      els.after.src = body.url;
      try { await els.after.decode(); } catch {}
      if (!state.liquid.drawing) warpClear();
      state.source = { width: body.original_width || body.width, height: body.original_height || body.height };
      state.preview = { width: body.width, height: body.height };
      els.badge.textContent = `${body.width}×${body.height} · ${(body.elapsed_ms / 1000).toFixed(2)}s` + (body.faces > 1 ? ` · ${body.faces} 张脸` : '');
      els.badge.style.display = 'block';
      applyParams(body.params, false);
      if (body.skin) {
        const skin = body.skin;
        els.skinInfo.textContent =
          `主体皮肤：脸 ${Number(skin.face).toFixed(1)}% · 身体 ${Number(skin.body).toFixed(1)}%`
          + `（${skin.parts} 处）· 主体占画面 ${Number(skin.subject).toFixed(1)}%`;
      }
      setStatus('预览已更新', 'ok');
      if (options && options.immediate) els.wrap.classList.add('on');
      // Remember this preview on the photo entry: switching back to it is then
      // instant, and the filmstrip tile can show the edited look.
      const entry = activeEntry();
      if (entry && entry.id === state.sourceId) {
        entry.params = cleanParams(readParams());
        entry.previewUrl = body.url;
        entry.previewKey = paramsKeyLocal(entry.params);
        entry.badge = els.badge.textContent;
        entry.source = { ...state.source };
        entry.preview = { ...state.preview };
        const thumb = thumbForRender(body.url);
        if (thumb) {
          entry.thumb = thumb;
          refreshFilmItem(entry);
        }
        scheduleSessionSave(400);
      }
      // Params changed: refresh the zoomed-in crops for the new look.
      state.crop.key = '';
      scheduleZoom(0);
      return true;
    } catch (error) {
      if (error && error.name === 'AbortError') {
        warpClear();
        return false;
      }
      if (seq === state.seq) {
        warpClear();
        if (error && error.status === 404) state.missingSource = true;
        setStatus(String(error.message || error), 'err');
      }
      return false;
    } finally {
      if (seq === state.seq) setBusy(false);
    }
  }

  function setSaveDisabled() {
    const ready = state.images.length > 0 && !!state.sourceId;
    els.saveTop.disabled = !ready;
    els.aiBtn.disabled = !ready || state.batch;
  }

  // ---- export: pick photos → pick folder → render at full resolution ----
  function selectedExportEntries() {
    return state.images.filter((entry) => state.exportSelected.has(entry.id));
  }

  function syncExportCount() {
    const count = selectedExportEntries().length;
    els.exportCount.textContent = `已选 ${count} / ${state.images.length} 张`;
    els.exportNext.disabled = count === 0;
    els.exportNext.textContent = count ? `下一步：选择位置（${count} 张）` : '下一步：选择位置';
  }

  function renderExportList() {
    const rows = state.images.map((entry, index) => {
      const row = document.createElement('label');
      row.className = 'export-row';
      const check = document.createElement('input');
      check.type = 'checkbox';
      check.checked = state.exportSelected.has(entry.id);
      check.addEventListener('change', () => {
        if (check.checked) state.exportSelected.add(entry.id);
        else state.exportSelected.delete(entry.id);
        syncExportCount();
      });
      const img = document.createElement('img');
      img.src = thumbUrlFor(entry);
      attachThumbFallback(img, entry);
      img.alt = '';
      const name = document.createElement('span');
      name.className = 'export-name';
      name.textContent = entry.name || `图片 ${index + 1}`;
      row.append(check, img, name);
      if (entry.id === state.sourceId) {
        const tag = document.createElement('span');
        tag.className = 'export-tag';
        tag.textContent = '当前';
        row.append(tag);
      }
      return row;
    });
    els.exportList.replaceChildren(...rows);
    syncExportCount();
  }

  function openExport() {
    if (!state.images.length || state.exporting || state.picking) return;
    captureActive();
    // First open keeps the current photo ticked; later opens keep the ticks
    // the user made last time.
    if (!selectedExportEntries().length) {
      state.exportSelected = new Set(state.sourceId ? [state.sourceId] : []);
    }
    state.exportDir = '';
    els.exportPick.hidden = false;
    els.exportWhere.hidden = true;
    els.exportResults.replaceChildren();
    els.exportNote.textContent = '导出前会按原分辨率重新渲染，不会压缩画质。';
    els.exportDir.textContent = '';
    els.exportStart.hidden = false;
    els.exportStart.disabled = false;
    els.exportBack.hidden = false;
    els.exportReveal.hidden = true;
    els.exportDone.hidden = true;
    renderExportList();
    if (!els.exportDialog.open) els.exportDialog.showModal();
  }

  async function chooseExportDir() {
    if (state.exporting || state.picking) return;
    const count = selectedExportEntries().length;
    if (!count) return;
    state.picking = true;
    els.exportNext.disabled = true;
    els.exportNote.textContent = '正在等待选择文件夹…';
    try {
      const response = await fetch('/api/dsh-beauty/pick-dir', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        credentials: 'same-origin',
        body: '{}',
      });
      const body = await response.json().catch(() => null);
      const code = body && body.error && body.error.code;
      if (code === 'E_CANCELLED') {
        els.exportNote.textContent = '已取消选择文件夹，可以再试一次。';
        return;
      }
      if (!response.ok || !body || body.ok !== true) {
        throw new Error((body && body.error && body.error.message) || '选择文件夹失败');
      }
      state.exportDir = body.dir;
      els.exportPick.hidden = true;
      els.exportWhere.hidden = false;
      els.exportDir.textContent = body.dir;
      els.exportNote.textContent = `将导出 ${count} 张图片到这个文件夹。`;
      els.exportResults.replaceChildren();
      els.exportStart.hidden = false;
      els.exportStart.disabled = false;
      els.exportBack.hidden = false;
      els.exportReveal.hidden = true;
      els.exportDone.hidden = true;
    } catch (error) {
      els.exportNote.textContent = '无法选择导出位置：' + String(error.message || error);
    } finally {
      state.picking = false;
      syncExportCount();
    }
  }

  async function runExport() {
    if (state.exporting || !state.exportDir) return;
    const entries = selectedExportEntries();
    if (!entries.length) return;
    state.exporting = true;
    setBusy(true, '导出中…');
    setStatus(`正在导出 ${entries.length} 张图片…`);
    els.exportStart.hidden = true;
    els.exportBack.hidden = true;
    els.exportReveal.hidden = true;
    els.exportDone.hidden = true;
    els.exportResults.replaceChildren();
    let done = 0;
    let failed = 0;
    for (let index = 0; index < entries.length; index += 1) {
      const entry = entries[index];
      const line = document.createElement('div');
      line.className = 'export-result';
      line.textContent = `正在导出（${index + 1}/${entries.length}）${entry.name || '图片'}…`;
      els.exportResults.append(line);
      els.exportResults.scrollTop = els.exportResults.scrollHeight;
      els.busyText.textContent = `导出 ${index + 1}/${entries.length}…`;
      try {
        const response = await fetch('/api/dsh-beauty/save', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            id: entry.id,
            params: cleanParams(entry.params),
            dir: state.exportDir,
          }),
        });
        const body = await response.json().catch(() => null);
        if (!response.ok || !body || body.ok !== true) {
          throw new Error((body && body.error && body.error.message) || '导出失败');
        }
        line.className = 'export-result ok';
        line.textContent = `✓ ${body.path}`;
        done += 1;
      } catch (error) {
        line.className = 'export-result err';
        line.textContent = `✗ ${entry.name || '图片'}：${String(error.message || error)}`;
        failed += 1;
      }
      els.exportResults.scrollTop = els.exportResults.scrollHeight;
    }
    state.exporting = false;
    setBusy(false);
    els.busyText.textContent = '处理中…';
    els.exportNote.textContent = failed
      ? `已导出 ${done} 张，${failed} 张失败。`
      : `已导出 ${done} 张。`;
    els.exportStart.hidden = true;
    els.exportBack.hidden = true;
    els.exportReveal.hidden = done === 0;
    els.exportDone.hidden = false;
    els.exportDone.focus();
    setStatus(
      failed ? `导出完成：${done} 张成功，${failed} 张失败` : `已导出 ${done} 张图片`,
