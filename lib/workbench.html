  function closeExport() {
    if (state.exporting || state.picking) return;
    if (els.exportDialog.open) els.exportDialog.close();
  }

  // ---- 一键修图（纯本地公式） ------------------------------------------
  const AI_LABELS = {
    smooth: '磨皮', whiten: '提亮', person: '人物提亮', detail: '细节', slim: '瘦脸', eyes: '大眼',
    temperature: '色温', tint: '色调', shadow: '眼影', liner: '眼线', blush: '腮红', lip: '口红',
    shadowColor: '眼影色', linerColor: '眼线色', blushColor: '腮红色', lipColor: '口红色',
  };
  function clearAi(abort) {
    if (abort && state.ai.controller) {
      try { state.ai.controller.abort(); } catch {}
    }
    state.ai.controller = null;
    state.ai.loading = false;
    state.ai.suggestion = null;
    state.ai.metrics = null;
    state.ai.snapshot = null;
    state.ai.undo = null;
    state.ai.meta = null;
    els.aiCard.hidden = true;
    els.aiApply.disabled = true;
    els.aiUndo.hidden = true;
    els.aiError.hidden = true;
    els.aiError.textContent = '';
  }

  function aiMetric(label, value) {
    const box = document.createElement('div');
    box.className = 'ai-metric';
    const name = document.createElement('span');
    name.textContent = label;
    const number = document.createElement('b');
    number.textContent = value;
    box.append(name, number);
    return box;
  }

  function fmt(value, digits) {
    const n = Number(value);
    return Number.isFinite(n) ? n.toFixed(digits) : '—';
  }

  function renderAiCard() {
    const suggestion = state.ai.suggestion;
    const meta = state.ai.meta;
    if (!suggestion || !meta) return;
    const metrics = state.ai.metrics || {};
    const skin = metrics.skin || {};
    const geo = metrics.geometry || {};
    const eyeL = Number(geo.eye_aspect_l);
    const eyeR = Number(geo.eye_aspect_r);
    const eyeAvg = Number(geo.eye_aspect);
    const eye = Number.isFinite(eyeAvg)
      ? eyeAvg
      : Number.isFinite(eyeL) && Number.isFinite(eyeR) ? (eyeL + eyeR) / 2 : null;

    els.aiSummary.textContent = suggestion.summary || '已按指标给出建议。';
    els.aiReasons.textContent = (suggestion.reasons || [])
      .slice(0, 4)
      .map((item) => `${AI_LABELS[item.param] || item.param}：${item.why}`)
      .join('\n');
    els.aiReasons.style.whiteSpace = 'pre-line';

    els.aiMetrics.replaceChildren(
      aiMetric('肤色 L*', fmt(skin.l_median, 1)),
      aiMetric('均匀度 σL', fmt(skin.l_std, 1)),
      aiMetric('下颌 / 脸宽', fmt(geo.jaw_ratio, 2)),
      aiMetric('眼裂比', fmt(eye, 2)),
      aiMetric('对称误差', fmt(geo.symmetry, 3)),
      aiMetric('瑕疵占比', skin.blemish_density == null ? '—' : `${(Number(skin.blemish_density) * 100).toFixed(1)}%`),
    );

    const chips = [];
    for (const key of suggestion.changed || []) {
      const chip = document.createElement('span');
      chip.className = 'ai-chip';
      const before = state.ai.snapshot ? state.ai.snapshot[key] : undefined;
      chip.textContent = `${AI_LABELS[key] || key} ${before === undefined ? '' : before + ' → '}${suggestion.params[key]}`;
      chips.push(chip);
    }
    if (chips.length === 0) {
      const chip = document.createElement('span');
      chip.className = 'ai-chip';
      chip.textContent = '参数保持不变';
      chips.push(chip);
    }
    els.aiDiff.replaceChildren(...chips);
    els.aiWarnings.textContent = (suggestion.warnings || []).join(' · ');

    const model = meta.model || {};
    const confidence = Math.round(Number(suggestion.confidence || 0) * 100);
    const upload = (meta.sentImages || []).length
      ? `已发送：${meta.sentImages.map((kind) => (kind === 'full' ? '整图' : kind === 'person' ? '主体' : '人脸')).join(' + ')}`
      : '未上传，全部本机计算';
    els.aiMeta.textContent =
      `引擎 ${model.name || model.model || '—'}（${model.provider || '—'}） · 置信度 ${confidence}%\n`
      + `用时 ${(Number(meta.elapsedMs || 0) / 1000).toFixed(2)}s · ${upload}\n`
      + `标准 ${meta.skill ? meta.skill.name + ' v' + meta.skill.version : '—'}`;

    els.aiError.hidden = true;
    els.aiApply.disabled = false;
    els.aiCard.hidden = false;
  }

  async function runAi() {
    if (!state.sourceId || state.ai.loading || state.busy || state.batch || state.exporting) return;
    const snapshot = readParams();
    state.ai.loading = true;
    state.ai.controller = new AbortController();
    state.ai.suggestion = null;
    state.ai.metrics = null;
    state.ai.snapshot = snapshot;
    state.ai.undo = null;
    state.ai.meta = null;
    els.aiCard.hidden = false;
    els.aiApply.disabled = true;
    els.aiUndo.hidden = true;
    els.aiRetry.disabled = true;
    els.aiError.hidden = true;
    els.aiError.textContent = '';
    els.aiSummary.textContent = '正在本机分析皮肤与比例，按公式计算参数…';
    els.aiReasons.textContent = '';
    els.aiMetrics.replaceChildren();
    els.aiDiff.replaceChildren();
    els.aiWarnings.textContent = '';
    els.aiMeta.textContent = '';
    els.aiBtn.disabled = true;
    setStatus('正在本机计算…');
    try {
      const response = await fetch('/api/dsh-beauty/ai-suggest', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        credentials: 'same-origin',
        signal: state.ai.controller.signal,
        body: JSON.stringify({ id: state.sourceId, params: snapshot }),
      });
      const body = await response.json().catch(() => null);
      if (!response.ok || !body || body.ok !== true) {
        const info = body && body.error ? body.error : {};
        const error = new Error(info.message || '一键修图失败');
        error.hint = info.hint;
        throw error;
      }
      state.ai.suggestion = body.suggestion;
      state.ai.metrics = body.metrics;
      state.ai.meta = {
        model: body.model,
        skill: body.skill,
        sentImages: body.sentImages,
        elapsedMs: body.elapsedMs,
      };
      renderAiCard();
      setStatus('参数建议已生成', 'ok');
    } catch (error) {
      if (error && error.name === 'AbortError') return;
      els.aiError.hidden = false;
      els.aiError.textContent = error.hint ? `${error.message}\n${error.hint}` : String(error.message || error);
      els.aiSummary.textContent = '本次没有改动任何参数。';
      setStatus('一键修图失败', 'err');
    } finally {
      state.ai.loading = false;
      state.ai.controller = null;
      els.aiBtn.disabled = !state.images.length || state.batch;
      els.aiRetry.disabled = false;
    }
  }

  function openAi() {
    if (!state.sourceId || state.ai.loading || state.busy || state.batch || state.exporting) return;
    const total = state.images.length;
    els.aiDialogNote.textContent = total > 1
      ? `当前共有 ${total} 张图片。选「当前图片」只会给当前这张建议；选「所有图片」会逐张计算并直接应用，已有的液化和笔刷笔画都会保留。`
      : '当前只有 1 张图片，两种选择效果相同。';
    els.aiDialogAll.disabled = total === 0;
    els.aiDialogCurrent.disabled = !state.sourceId;
    if (!els.aiDialog.open) {
      if (typeof els.aiDialog.showModal === 'function') els.aiDialog.showModal();
      else runAi();
    }
  }

  function closeAiDialog() {
    if (els.aiDialog.open) els.aiDialog.close();
  }

  function aiCurrent() {
    closeAiDialog();
    runAi();
  }

  /** 一键修图 → 所有图片：batch the local calculator over every imported photo. */
  async function runAiAll() {
    if (!state.images.length || state.batch || state.ai.loading) return;
    captureActive();
    clearAi(true);
    state.batch = true;
    setSaveDisabled();
    let done = 0;
    let failed = 0;
    setBusy(true, `批量修图 1/${state.images.length}…`);
    for (let index = 0; index < state.images.length; index += 1) {
      const entry = state.images[index];
      const label = entry.name || `第 ${index + 1} 张`;
      setStatus(`正在计算 ${index + 1}/${state.images.length}：${label}`);
      els.busyText.textContent = `批量修图 ${index + 1}/${state.images.length}…`;
      try {
        const response = await fetch('/api/dsh-beauty/ai-suggest', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ id: entry.id, params: cleanParams(entry.params) }),
        });
        const body = await response.json().catch(() => null);
        if (!response.ok || !body || body.ok !== true) {
          throw new Error((body && body.error && body.error.message) || '计算失败');
        }
        const suggested = {};
        for (const [key, value] of Object.entries(body.suggestion.params || {})) {
          suggested[SNAKE[key] || key] = value;
        }
        // Merge over the photo's own params so strokes and makeup choices survive.
        entry.params = cleanParams({ ...cleanParams(entry.params), ...suggested });
        entry.previewUrl = '';
        entry.previewKey = '';
        done += 1;
      } catch (error) {
        failed += 1;
      }
    }
    state.batch = false;
    setBusy(false);
    els.busyText.textContent = '处理中…';
    setSaveDisabled();
    const active = activeEntry();
    if (active) applyEntryParams(active);
    renderFilmstrip();
    if (active) await render({ immediate: true });
    saveSession();
    setStatus(
      failed
        ? `一键修图完成：已应用到 ${done} 张，${failed} 张未应用（可能没检测到人脸）`
        : `一键修图完成：已应用到全部 ${done} 张图片`,
      failed ? 'err' : 'ok',
    );
  }

  function aiAll() {
    closeAiDialog();
    runAiAll().catch((error) => setStatus(String(error.message || error), 'err'));
  }

  function closeAi() {
    if (state.ai.controller) {
      try { state.ai.controller.abort(); } catch {}
    }
    els.aiCard.hidden = true;
  }

  function applyAi() {
    const suggestion = state.ai.suggestion;
    if (!suggestion) return;
    const before = readParams();
    state.ai.undo = before;
    applyParams({ ...before, ...suggestion.params }, true);
    els.aiApply.disabled = true;
    els.aiUndo.hidden = false;
    setStatus('已应用 AI 建议 · 可撤销', 'ok');
    schedule(0);
  }

  function undoAi() {
    if (!state.ai.undo) return;
    const snapshot = state.ai.undo;
    state.ai.undo = null;
    applyParams(snapshot, true);
    els.aiUndo.hidden = true;
    els.aiApply.disabled = false;
    setStatus('已撤销 AI 建议', 'ok');
    schedule(0);
  }

  function showOriginal(on) {
    if (zoomLayerActive()) {
      els.before.classList.remove('on');
      if (els.zoomBefore.getAttribute('src')) {
        els.zoomBefore.style.display = on ? 'block' : 'none';
        return;
      }
      // First press before the prefetch landed: fetch it now rather than showing
      // the blurry CSS-scaled copy underneath.
      if (on && state.crop.box) {
        fetchCrop(state.crop.box, 'original').then((url) => {
          if (!url) return;
          els.zoomBefore.src = url;
          els.zoomBefore.style.display = 'block';
          placeZoom();
        }).catch(() => {});
      }
      return;
    }
    els.before.classList.toggle('on', on);
  }

  // ---- liquify ---------------------------------------------------------
  // Strokes live in source-normalised coordinates and are applied by the engine.
  // Dragging only records the path; the preview refreshes when the pointer lifts,
  // so a 4K photo does not re-render on every pointermove.
  const LIQUID_LABELS = { push: '推移', bloat: '膨胀', pucker: '收缩' };
  let trailCtx = null;

  function liquidRadius() {
    return Math.max(6, state.liquid.radius * els.after.getBoundingClientRect().width);
  }

  function maskRadius() {
    return Math.max(4, state.mask.radius * els.after.getBoundingClientRect().width);
  }

  function wrinkleRadius() {
    return Math.max(1, state.wrinkle.radius * els.after.getBoundingClientRect().width);
  }

  function brushActive() {
    return state.mask.on || state.liquid.on || state.wrinkle.on;
  }

  function brushRadius() {
    if (state.mask.on) return maskRadius();
    if (state.wrinkle.on) return wrinkleRadius();
    return liquidRadius();
  }

  function liquidPoint(event) {
    const rect = els.after.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    const x = (event.clientX - rect.left) / rect.width;
    const y = (event.clientY - rect.top) / rect.height;
    return [Math.max(0, Math.min(1, x)), Math.max(0, Math.min(1, y))];
  }

  function prepareTrail() {
    const canvas = els.trail;
    const dpr = window.devicePixelRatio || 1;
    const width = Math.max(1, els.stage.clientWidth);
    const height = Math.max(1, els.stage.clientHeight);
    const w = Math.round(width * dpr);
    const h = Math.round(height * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    trailCtx = canvas.getContext('2d');
    trailCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    trailCtx.clearRect(0, 0, width, height);
    return { ctx: trailCtx, width, height };
  }

  function clearTrail() {
    const canvas = els.trail;
    if (!canvas.width) return;
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  // ---- live liquify preview -------------------------------------------
  // The host warps the photo when the pointer lifts. While dragging, the
  // pixels currently on screen are wrapped with the same inverse-map maths on
  // a stage-sized overlay, so the brush deforms the image immediately; the
  // overlay stays until the rendered preview decodes, then the crisp result
  // takes over. Coordinates come from the visible layer (base preview, or the
  // 1:1 crop when zoomed), so the effect lines up at every zoom level.
  let warpState = null;

  /** Reflect an out-of-range sample index, matching cv2.BORDER_REFLECT. */
  function warpReflect(value, n) {
    if (n <= 1) return 0;
    const period = 2 * (n - 1);
    let v = Math.abs(value) % period;
    if (v > n - 1) v = period - v;
    return v;
  }

  /** Screen-space placement of the layer the pointer is drawing on. */
  function warpMapping() {
    const sw = state.source.width;
    const sh = state.source.height;
    if (!sw || !sh) return null;
    const sr = els.stage.getBoundingClientRect();
    const crop = visibleSourceRect();
    if (crop && zoomLayerActive() && els.zoomAfter.naturalWidth) {
      const zr = els.zoomAfter.getBoundingClientRect();
      if (zr.width > 1) {
        const scale = zr.width / crop[2];
        return {
          scale,
          sx: zr.left - sr.left - crop[0] * scale,
          sy: zr.top - sr.top - crop[1] * scale,
          sw, sh, crop,
        };
      }
    }
    const ar = els.after.getBoundingClientRect();
    if (ar.width <= 1) return null;
    return { scale: ar.width / sw, sx: ar.left - sr.left, sy: ar.top - sr.top, sw, sh, crop: null };
  }

  function warpBegin() {
    warpClear();
    if (!state.source.width || !els.after.naturalWidth) return;
    const map = warpMapping();
    if (!map) return;
    const stage = els.stage;
    const width = Math.max(1, stage.clientWidth);
    const height = Math.max(1, stage.clientHeight);
    const canvas = els.warp;
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    const comp = document.createElement('canvas');
    comp.width = width;
    comp.height = height;
    const cctx = comp.getContext('2d', { willReadFrequently: true });
    const sr = stage.getBoundingClientRect();
    const wr = els.wrap.getBoundingClientRect();
    const ar = els.after.getBoundingClientRect();
    const round = 10;
    cctx.save();
    cctx.beginPath();
    if (cctx.roundRect) cctx.roundRect(wr.left - sr.left, wr.top - sr.top, wr.width, wr.height, round);
    else cctx.rect(wr.left - sr.left, wr.top - sr.top, wr.width, wr.height);
    cctx.clip();
    cctx.drawImage(els.after, ar.left - sr.left, ar.top - sr.top, ar.width, ar.height);
    cctx.restore();
    if (map.crop && els.zoomAfter.naturalWidth) {
      const zr = els.zoomAfter.getBoundingClientRect();
      const zl = els.zoomLayer.getBoundingClientRect();
      cctx.save();
      cctx.beginPath();
      if (cctx.roundRect) cctx.roundRect(zl.left - sr.left, zl.top - sr.top, zl.width, zl.height, round);
      else cctx.rect(zl.left - sr.left, zl.top - sr.top, zl.width, zl.height);
      cctx.clip();
      cctx.drawImage(els.zoomAfter, zr.left - sr.left, zr.top - sr.top, zr.width, zr.height);
      cctx.restore();
    }
    const data = cctx.getImageData(0, 0, width, height).data;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, width, height);
    ctx.drawImage(comp, 0, 0);
    canvas.style.display = 'block';
    warpState = { canvas, ctx, comp, data, width, height, map, box: null };
  }

  /** Resample the pointer path at the engine's spacing (screen pixels). */
  function warpResample(points, radius) {
    if (!points.length) return [];
    if (points.length === 1) return [points[0]];
    const spacing = Math.max(radius * 0.22, 1.5);
    const out = [points[0]];
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i];
      const b = points[i + 1];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / spacing));
      for (let k = 1; k <= steps; k++) out.push([a[0] + dx * (k / steps), a[1] + dy * (k / steps)]);
    }
    return out;
  }

  function warpPaint(draw) {
    if (!warpState || !draw || !draw.points.length) return;
    const { width, height, data, map } = warpState;
    const radius = Math.max(3, draw.radius * map.sw * map.scale);
    const strength = Math.min(1, Math.max(0, draw.strength));
    const path = warpResample(
      draw.points.map((p) => [map.sx + p[0] * map.sw * map.scale, map.sy + p[1] * map.sh * map.scale]),
      radius
    );
    if (!path.length) return;
    const pad = radius * 1.25;
    let x0 = Math.floor(Math.min(...path.map((p) => p[0])) - pad);
    let x1 = Math.ceil(Math.max(...path.map((p) => p[0])) + pad);
    let y0 = Math.floor(Math.min(...path.map((p) => p[1])) - pad);
    let y1 = Math.ceil(Math.max(...path.map((p) => p[1])) + pad);
    x0 = Math.max(0, x0);
    y0 = Math.max(0, y0);
    x1 = Math.min(width, x1);
    y1 = Math.min(height, y1);
    const bw = x1 - x0;
    const bh = y1 - y0;
    if (bw < 2 || bh < 2) return;

    const mode = draw.mode;
    const push = mode === 'push' && path.length > 1;
    if (!push && mode === 'push') return;
    const segs = [];
    if (push) {
      for (let i = 0; i < path.length - 1; i++) {
        const a = path[i];
        const b = path[i + 1];
        segs.push({
          mx: (a[0] + b[0]) / 2,
          my: (a[1] + b[1]) / 2,
          mxMove: (b[0] - a[0]) * strength,
          myMove: (b[1] - a[1]) * strength,
        });
      }
    } else {
      const k = (strength * 0.30) / Math.max(1, Math.sqrt(path.length)) * (mode === 'pucker' ? -1 : 1);
      for (const p of path) segs.push({ px: p[0], py: p[1], pxK: k });
    }

    const limit = radius * 0.45;
    const invR2 = 1 / (radius * radius);
    const out = new Uint8ClampedArray(bw * bh * 4);
    for (let y = y0; y < y1; y++) {
      for (let x = x0; x < x1; x++) {
        let dx = 0;
        let dy = 0;
        if (push) {
          for (const s of segs) {
            const d2 = ((x - s.mx) ** 2 + (y - s.my) ** 2) * invR2;
            if (d2 >= 1) continue;
            const fall = (1 - d2) * (1 - d2);
            dx += s.mxMove * fall;
            dy += s.myMove * fall;
          }
        } else {
          for (const s of segs) {
            const d2 = ((x - s.px) ** 2 + (y - s.py) ** 2) * invR2;
            if (d2 >= 1) continue;
            const fall = (1 - d2) * (1 - d2);
            const scale = s.pxK * fall;
            dx += (x - s.px) * scale;
            dy += (y - s.py) * scale;
          }
        }
        const mag = Math.hypot(dx, dy);
        if (mag > limit) {
          const f = limit / mag;
          dx *= f;
          dy *= f;
        }
        const sx = warpReflect(x - dx, width);
        const sy = warpReflect(y - dy, height);
        const ix = Math.floor(sx);
        const iy = Math.floor(sy);
        const fx = sx - ix;
        const fy = sy - iy;
        const ix1 = Math.min(width - 1, ix + 1);
        const iy1 = Math.min(height - 1, iy + 1);
        const i00 = (iy * width + ix) * 4;
        const i10 = (iy * width + ix1) * 4;
        const i01 = (iy1 * width + ix) * 4;
        const i11 = (iy1 * width + ix1) * 4;
        const o = ((y - y0) * bw + (x - x0)) * 4;
        const w00 = (1 - fx) * (1 - fy);
        const w10 = fx * (1 - fy);
        const w01 = (1 - fx) * fy;
        const w11 = fx * fy;
        for (let c = 0; c < 4; c++) {
          out[o + c] = data[i00 + c] * w00 + data[i10 + c] * w10 + data[i01 + c] * w01 + data[i11 + c] * w11;
        }
      }
    }
    if (warpState.box) {
      const b = warpState.box;
      warpState.ctx.drawImage(warpState.comp, b.x, b.y, b.w, b.h, b.x, b.y, b.w, b.h);
    }
    warpState.ctx.putImageData(new ImageData(out, bw, bh), x0, y0);
    warpState.box = { x: x0, y: y0, w: bw, h: bh };
  }

  function warpRender() {
    const draw = state.liquid.drawing;
    if (!draw) return;
    warpPaint(draw);
  }

  function warpClear() {
    if (!warpState) return;
    warpState.ctx.clearRect(0, 0, warpState.width, warpState.height);
    warpState.canvas.style.display = 'none';
    warpState = null;
  }

  function drawTrail(draw = state.liquid.drawing, color = '') {
    const { ctx } = prepareTrail();
    els.trail.style.display = 'block';
    if (!draw || !draw.points || draw.points.length === 0) return;
    const ar = els.after.getBoundingClientRect();
    const sr = els.stage.getBoundingClientRect();
    const accent = color || (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '').trim() || '#5b8cff';
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (draw.points.length >= 2) {
      ctx.beginPath();
      draw.points.forEach((point, index) => {
        const x = ar.left - sr.left + point[0] * ar.width;
        const y = ar.top - sr.top + point[1] * ar.height;
        if (index === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }
    const last = draw.points[draw.points.length - 1];
    ctx.beginPath();
    ctx.arc(ar.left - sr.left + last[0] * ar.width, ar.top - sr.top + last[1] * ar.height, Math.max(3, brushRadius() / 2), 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function showBrush(event) {
    if (!brushActive() || !state.sourceId) {
      els.brush.style.display = 'none';
      return;
    }
    const ar = els.after.getBoundingClientRect();
    const sr = els.stage.getBoundingClientRect();
    if (event.clientX < ar.left || event.clientX > ar.right || event.clientY < ar.top || event.clientY > ar.bottom) {
      els.brush.style.display = 'none';
      return;
    }
    const size = brushRadius() * 2;
    els.brush.style.display = 'block';
    els.brush.style.width = size.toFixed(1) + 'px';
    els.brush.style.height = size.toFixed(1) + 'px';
    els.brush.style.left = (event.clientX - sr.left - size / 2).toFixed(1) + 'px';
    els.brush.style.top = (event.clientY - sr.top - size / 2).toFixed(1) + 'px';
  }

  function updateLiquidUI() {
    const { strokes, redo } = state.liquid;
    if (!state.liquid.on) warpClear();
    els.liquidCount.textContent = `${strokes.length} 笔`;
    els.liquidUndo.disabled = strokes.length === 0;
    els.liquidRedo.disabled = redo.length === 0;
    els.liquidClear.disabled = strokes.length === 0 && redo.length === 0;
    els.liquidRadiusVal.textContent = Math.round(state.liquid.radius * 100) + '%';
    els.liquidStrengthVal.textContent = Math.round(state.liquid.strength * 100);
    els.wrap.classList.toggle('painting', state.liquid.on);
    els.compareHint.textContent = state.liquid.on
      ? '液化笔刷 · 拖动实时变形，抬手后渲染'
      : state.wrinkle.on
        ? '皱纹修复笔 · 涂抹处皱纹消除 · 滚轮调大小'
        : state.mask.on
          ? '补皮肤画笔 · 涂抹加入人物遮罩 · 滚轮调大小'
          : '滚轮缩放 · 拖动平移 · 按住看原图';
    for (const button of els.liquidModes.querySelectorAll('[data-liquid]')) {
      button.classList.toggle('on', button.dataset.liquid === state.liquid.mode);
    }
    if (!state.liquid.on) {
      els.brush.style.display = 'none';
      els.trail.style.display = 'none';
    }
  }

  function resetLiquid() {
    state.liquid.strokes = [];
    state.liquid.redo = [];
    state.liquid.drawing = null;
    clearTrail();
    warpClear();
    updateLiquidUI();
  }

  function startLiquid(event) {
    const point = liquidPoint(event);
    if (!point) return;
    state.liquid.drawing = {
      mode: state.liquid.mode,
      radius: state.liquid.radius,
      strength: state.liquid.strength,
      points: [point],
    };
    warpBegin();
    warpRender();
    showBrush(event);
    drawTrail();
    try { els.wrap.setPointerCapture(event.pointerId); } catch {}
    event.preventDefault();
  }

  function appendLiquid(event) {
    const draw = state.liquid.drawing;
    if (!draw) return;
    const point = liquidPoint(event);
    if (!point) return;
    const last = draw.points[draw.points.length - 1];
    if (Math.abs(point[0] - last[0]) < 0.0015 && Math.abs(point[1] - last[1]) < 0.0015) return;
    if (draw.points.length >= 512) return;
    draw.points.push(point);
    warpRender();
    drawTrail();
  }

  function endLiquid() {
    const draw = state.liquid.drawing;
    if (!draw) return;
    state.liquid.drawing = null;
    clearTrail();
    els.trail.style.display = 'none';
    if (draw.mode === 'push' && draw.points.length < 2) {
      warpClear();
      return;
    }
    state.liquid.strokes.push(draw);
    state.liquid.redo = [];
    updateLiquidUI();
    render();
    saveSession();
  }

  function undoLiquid() {
    if (!state.liquid.strokes.length) return;
    warpClear();
    state.liquid.redo.push(state.liquid.strokes.pop());
    updateLiquidUI();
    render();
    saveSession();
  }

  function redoLiquid() {
    if (!state.liquid.redo.length) return;
    warpClear();
    state.liquid.strokes.push(state.liquid.redo.pop());
    updateLiquidUI();
    render();
    saveSession();
  }

  // ---- manual skin mask brush -----------------------------------------
  // Painted strokes are source-normalised, so the preview, the 1:1 crop and the
  // full-res save all add the same patch to the subject mask.
  const MASK_TRAIL = '#ffb454';

  function updateMaskUI() {
    const { on, strokes } = state.mask;
    els.maskBtn.classList.toggle('on', on);
    els.maskBtn.setAttribute('aria-pressed', String(on));
    els.wrap.classList.toggle('brushing', on);
    els.maskHint.hidden = !(on || strokes.length > 0);
    els.maskCount.textContent = String(strokes.length);
    els.maskClear.disabled = strokes.length === 0;
    if (on) {
      els.compareHint.textContent = '补皮肤画笔 · 涂抹加入人物遮罩 · 滚轮调大小';
    } else if (!state.liquid.on && !state.wrinkle.on) {
      els.compareHint.textContent = '滚轮缩放 · 拖动平移 · 按住看原图';
    }
    if (!on && !state.mask.drawing) {
      clearTrail();
      els.trail.style.display = 'none';
      if (!state.liquid.on && !state.wrinkle.on) els.brush.style.display = 'none';
    }
  }

  function resetMask() {
    state.mask.strokes = [];
    state.mask.drawing = null;
    clearTrail();
    els.trail.style.display = 'none';
    updateMaskUI();
  }

  function setMaskBrush(on) {
    if (state.mask.on === on) return;
    state.mask.on = on;
    if (on) {
      state.liquid.on = false;
      els.liquidToggle.checked = false;
      warpClear();
      updateLiquidUI();
      if (state.wrinkle.on) {
        state.wrinkle.on = false;
        state.wrinkle.drawing = null;
        clearTrail();
        els.trail.style.display = 'none';
        updateWrinkleUI();
      }
    } else {
      state.mask.drawing = null;
      clearTrail();
      els.trail.style.display = 'none';
    }
    updateMaskUI();
    setStatus(on ? '补皮肤画笔：涂抹漏掉的皮肤，滚轮调笔刷大小' : '已退出补皮肤画笔');
  }

  function startMask(event) {
    const point = liquidPoint(event);
    if (!point) return;
    state.mask.drawing = { radius: state.mask.radius, points: [point] };
    clearTrail();
    drawTrail(state.mask.drawing, MASK_TRAIL);
    showBrush(event);
    try { els.wrap.setPointerCapture(event.pointerId); } catch {}
    event.preventDefault();
  }

  function appendMask(event) {
    const draw = state.mask.drawing;
    if (!draw) return;
    const point = liquidPoint(event);
    if (!point) return;
    const last = draw.points[draw.points.length - 1];
    if (Math.abs(point[0] - last[0]) < 0.0015 && Math.abs(point[1] - last[1]) < 0.0015) return;
    if (draw.points.length >= 512) return;
    draw.points.push(point);
    drawTrail(draw, MASK_TRAIL);
  }

  function endMask() {
    const draw = state.mask.drawing;
    if (!draw) return;
    state.mask.drawing = null;
    clearTrail();
    els.trail.style.display = 'none';
    state.mask.strokes.push(draw);
    updateMaskUI();
    setStatus(`已补 ${state.mask.strokes.length} 笔皮肤，正在渲染…`);
    render();
    saveSession();
  }

  // ---- wrinkle repair brush --------------------------------------------
  // Same contract as the mask brush: strokes are source-normalised, so the
  // preview, the 1:1 crop and the full-res save flatten the same pixels.
  const WRINKLE_TRAIL = '#7fd3ff';

  function updateWrinkleUI() {
    const { on, strokes } = state.wrinkle;
    els.wrinkleBtn.classList.toggle('on', on);
    els.wrinkleBtn.setAttribute('aria-pressed', String(on));
    els.wrap.classList.toggle('wrinkling', on);
    els.wrinkleHint.hidden = !(on || strokes.length > 0);
    els.wrinkleCount.textContent = String(strokes.length);
    els.wrinkleClear.disabled = strokes.length === 0;
    if (on) {
      els.compareHint.textContent = '皱纹修复笔 · 涂抹处皱纹消除 · 滚轮调大小';
    } else if (!state.liquid.on && !state.mask.on) {
      els.compareHint.textContent = '滚轮缩放 · 拖动平移 · 按住看原图';
    }
    if (!on && !state.wrinkle.drawing) {
      clearTrail();
      els.trail.style.display = 'none';
      if (!state.liquid.on && !state.mask.on) els.brush.style.display = 'none';
    }
  }

  function resetWrinkle() {
    state.wrinkle.strokes = [];
    state.wrinkle.drawing = null;
    clearTrail();
    els.trail.style.display = 'none';
    updateWrinkleUI();
  }

  function setWrinkleBrush(on) {
    if (state.wrinkle.on === on) return;
    state.wrinkle.on = on;
    if (on) {
      setMaskBrush(false);
      state.liquid.on = false;
      els.liquidToggle.checked = false;
      warpClear();
      updateLiquidUI();
    } else {
      state.wrinkle.drawing = null;
      clearTrail();
      els.trail.style.display = 'none';
    }
    updateWrinkleUI();
    setStatus(on ? '皱纹修复笔：涂抹要消除的皱纹，滚轮调笔刷大小' : '已退出皱纹修复笔');
  }

  function startWrinkle(event) {
    const point = liquidPoint(event);
    if (!point) return;
    state.wrinkle.drawing = { radius: state.wrinkle.radius, points: [point] };
    clearTrail();
    drawTrail(state.wrinkle.drawing, WRINKLE_TRAIL);
    showBrush(event);
    try { els.wrap.setPointerCapture(event.pointerId); } catch {}
    event.preventDefault();
  }

  function appendWrinkle(event) {
    const draw = state.wrinkle.drawing;
    if (!draw) return;
    const point = liquidPoint(event);
    if (!point) return;
    const last = draw.points[draw.points.length - 1];
    if (Math.abs(point[0] - last[0]) < 0.0015 && Math.abs(point[1] - last[1]) < 0.0015) return;
    if (draw.points.length >= 512) return;
    draw.points.push(point);
    drawTrail(draw, WRINKLE_TRAIL);
  }

  function endWrinkle() {
    const draw = state.wrinkle.drawing;
    if (!draw) return;
    state.wrinkle.drawing = null;
    clearTrail();
    els.trail.style.display = 'none';
    state.wrinkle.strokes.push(draw);
    updateWrinkleUI();
    setStatus(`已标记 ${state.wrinkle.strokes.length} 笔皱纹，正在渲染…`);
    render();
    saveSession();
  }

  // ---- wiring
  els.open.addEventListener('click', () => els.file.click());
  els.file.addEventListener('change', () => {
    const files = els.file.files ? Array.from(els.file.files) : [];
    els.file.value = '';
    if (files.length) uploadFiles(files);
  });

  let dragDepth = 0;
  const stage = $('stage');
  stage.addEventListener('dragenter', (event) => {
    event.preventDefault();
    dragDepth += 1;
    els.drop.classList.add('drag');
  });
  stage.addEventListener('dragover', (event) => event.preventDefault());
  stage.addEventListener('dragleave', (event) => {
    event.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) els.drop.classList.remove('drag');
  });
  stage.addEventListener('drop', (event) => {
    event.preventDefault();
    dragDepth = 0;
    els.drop.classList.remove('drag');
    const files = event.dataTransfer && event.dataTransfer.files ? Array.from(event.dataTransfer.files) : [];
    if (files.length) uploadFiles(files);
  });

  stage.addEventListener('pointermove', showBrush);
  stage.addEventListener('pointerleave', () => { els.brush.style.display = 'none'; });

  window.addEventListener('paste', (event) => {
    const items = event.clipboardData && event.clipboardData.items;
    if (!items) return;
    const files = [];
    for (const item of items) {
      if (item.type && item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (file) files.push(file);
      }
    }
    if (files.length) uploadFiles(files);
  });

  for (const key of sliders) {
    $(key).addEventListener('input', () => {
      syncLabels();
      schedule();
    });
  }

  // 整体肤色 2D 盘：点/拖直接落点，方向键微调，双击或「归零」回中性。
  function toneFromEvent(event) {
    const rect = els.tonePad.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return null;
    const x = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
    const y = Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height));
    return { tint: Math.round((x - 0.5) * 100), temperature: Math.round((0.5 - y) * 100) };
  }

  els.tonePad.addEventListener('pointerdown', (event) => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    event.preventDefault();
    els.tonePad.focus();
    const point = toneFromEvent(event);
    if (!point) return;
    state.tonePointer = event.pointerId;
    els.tonePad.classList.add('dragging');
    try { els.tonePad.setPointerCapture(event.pointerId); } catch {}
    setTone(point.temperature, point.tint, { commit: true });
  });

  els.tonePad.addEventListener('pointermove', (event) => {
    if (state.tonePointer !== event.pointerId) return;
    const point = toneFromEvent(event);
    if (point) setTone(point.temperature, point.tint, { commit: true });
  });

  const endToneDrag = (event) => {
    if (state.tonePointer !== event.pointerId) return;
    state.tonePointer = null;
    els.tonePad.classList.remove('dragging');
  };
  els.tonePad.addEventListener('pointerup', endToneDrag);
  els.tonePad.addEventListener('pointercancel', endToneDrag);

  els.tonePad.addEventListener('keydown', (event) => {
    const step = event.shiftKey ? 5 : 1;
    let temperature = state.tone.temperature;
    let tint = state.tone.tint;
    switch (event.key) {
      case 'ArrowUp': temperature += step; break;
      case 'ArrowDown': temperature -= step; break;
      case 'ArrowLeft': tint -= step; break;
      case 'ArrowRight': tint += step; break;
      case 'Home': temperature = 0; tint = 0; break;
      default: return;
    }
    event.preventDefault();
    setTone(temperature, tint, { commit: true });
  });

  els.tonePad.addEventListener('dblclick', () => setTone(0, 0, { commit: true }));
  els.toneReset.addEventListener('click', () => setTone(0, 0, { commit: true }));

  for (const key of colours) {
    $(key).addEventListener('input', () => {
      rememberColours();
      schedule();
    });
  }

  for (const button of document.querySelectorAll('[data-preset]')) {
    button.addEventListener('click', () => {
      const preset = PRESETS[button.dataset.preset];
      if (!preset) return;
      applyParams(preset, true);
      rememberColours();
      schedule(40);
    });
  }

  els.liquidToggle.addEventListener('change', () => {
    state.liquid.on = els.liquidToggle.checked;
    if (state.liquid.on && state.mask.on) {
      state.mask.on = false;
      els.maskBtn.classList.remove('on');
      els.maskBtn.setAttribute('aria-pressed', 'false');
      state.mask.drawing = null;
      clearTrail();
      els.trail.style.display = 'none';
    }
    updateLiquidUI();
    updateMaskUI();
    setStatus(state.liquid.on ? '液化笔刷已开启：在照片上拖动' : '液化笔刷已关闭');
  });

  els.maskBtn.addEventListener('click', () => setMaskBrush(!state.mask.on));
  els.wrinkleBtn.addEventListener('click', () => setWrinkleBrush(!state.wrinkle.on));
  els.wrinkleClear.addEventListener('click', () => {
    resetWrinkle();
    render();
    saveSession();
    setStatus('已清除皱纹修复笔');
  });
  els.maskClear.addEventListener('click', () => {
    resetMask();
    render();
    saveSession();
    setStatus('已清除手动补的皮肤');
  });

  els.liquidModes.addEventListener('click', (event) => {
    const button = event.target.closest('[data-liquid]');
    if (!button || !LIQUID_LABELS[button.dataset.liquid]) return;
    state.liquid.mode = button.dataset.liquid;
    updateLiquidUI();
    scheduleSessionSave();
  });

  els.liquidRadius.addEventListener('input', () => {
    state.liquid.radius = Math.max(0.005, Math.min(0.6, Number(els.liquidRadius.value) / 100));
    updateLiquidUI();
    scheduleSessionSave();
  });

  els.liquidStrength.addEventListener('input', () => {
    state.liquid.strength = Math.max(0.02, Math.min(1, Number(els.liquidStrength.value) / 100));
    updateLiquidUI();
    scheduleSessionSave();
  });

  els.liquidUndo.addEventListener('click', undoLiquid);
  els.liquidRedo.addEventListener('click', redoLiquid);
  els.liquidClear.addEventListener('click', () => {
    resetLiquid();
    render();
    saveSession();
  });

  els.compare.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    showOriginal(true);
  });
  const release = () => showOriginal(false);
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  els.wrap.addEventListener('wheel', (event) => {
    if (!state.sourceId) return;
    event.preventDefault();
    const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? 400 : 1;
    if (state.mask.on) {
      state.mask.radius = Math.max(0.006, Math.min(0.2, state.mask.radius * Math.exp(-event.deltaY * unit * 0.0012)));
      updateMaskUI();
      showBrush(event);
      scheduleSessionSave(250);
      setStatus(`笔刷 ${Math.round(state.mask.radius * 100)}%`);
      return;
    }
    if (state.wrinkle.on) {
      state.wrinkle.radius = Math.max(0.001, Math.min(0.12, state.wrinkle.radius * Math.exp(-event.deltaY * unit * 0.0011)));
      updateWrinkleUI();
      showBrush(event);
      scheduleSessionSave(250);
      setStatus(`笔刷 ${(state.wrinkle.radius * 100).toFixed(state.wrinkle.radius < 0.01 ? 1 : 0)}%`);
      return;
    }
    zoomAt(event.clientX, event.clientY, Math.exp(-event.deltaY * unit * 0.0015));
  }, { passive: false });

  els.wrap.addEventListener('dblclick', () => {
    if (!state.mask.on && !state.wrinkle.on) resetZoom();
  });
  els.zoomBadge.addEventListener('click', (event) => {
    event.stopPropagation();
    resetZoom();
  });

  els.wrap.addEventListener('pointerdown', (event) => {
    if (event.button !== 0 || !state.sourceId) return;
    if (event.target && event.target.closest && event.target.closest('.zoom-badge')) return;
    if (state.mask.on) {
      startMask(event);
      return;
    }
    if (state.wrinkle.on) {
      startWrinkle(event);
      return;
    }
    if (state.liquid.on) {
      startLiquid(event);
      return;
    }
    if (state.zoom <= 1.001) {
      showOriginal(true);
      return;
    }
    state.drag = { x: event.clientX, y: event.clientY, px: state.panX, py: state.panY, moved: false, id: event.pointerId };
    els.wrap.classList.add('dragging');
    try { els.wrap.setPointerCapture(event.pointerId); } catch {}
  });

  els.wrap.addEventListener('pointermove', (event) => {
    if (state.mask.drawing) {
      appendMask(event);
      return;
    }
    if (state.wrinkle.drawing) {
      appendWrinkle(event);
      return;
    }
    if (state.liquid.drawing) {
      appendLiquid(event);
      return;
    }
    const drag = state.drag;
    if (!drag) return;
    const dx = event.clientX - drag.x;
    const dy = event.clientY - drag.y;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    if (!drag.moved) return;
    state.panX = drag.px + dx;
    state.panY = drag.py + dy;
    clampPan();
    applyZoom();
  });

  const endPan = () => {
    endMask();
    endWrinkle();
    endLiquid();
    if (!state.drag) return;
    const drag = state.drag;
    state.drag = null;
    els.wrap.classList.remove('dragging');
    try { els.wrap.releasePointerCapture(drag.id); } catch {}
    scheduleZoom(120);
  };
  window.addEventListener('pointerup', endPan);
  window.addEventListener('pointercancel', endPan);

  els.reset.addEventListener('click', () => {
    clearAi(true);
    applyParams(defaultParams(), true);
    resetLiquid();
    resetMask();
    resetWrinkle();
    schedule(40);
  });

  els.saveTop.addEventListener('click', openExport);

  els.aiBtn.addEventListener('click', openAi);
  els.aiClose.addEventListener('click', closeAi);
  els.aiRetry.addEventListener('click', runAi);
  els.aiApply.addEventListener('click', applyAi);
  els.aiUndo.addEventListener('click', undoAi);

  // ---- multi-image wiring ----------------------------------------------
  els.filmTrack.addEventListener('click', (event) => {
    const item = event.target.closest('.film-item');
    if (!item) return;
    if (event.target.closest('.film-x')) {
      removeImage(item.dataset.id);
      return;
    }
    selectImage(item.dataset.id);
  });
  els.filmTrack.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const item = event.target.closest('.film-item');
    if (!item || event.target.closest('.film-x')) return;
    event.preventDefault();
    selectImage(item.dataset.id);
  });
  // A vertical wheel over the horizontal strip scrolls it, like a trackpad row.
  els.filmTrack.addEventListener('wheel', (event) => {
    if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
    const track = els.filmTrack;
    if (track.scrollWidth <= track.clientWidth) return;
    event.preventDefault();
    track.scrollLeft += event.deltaY;
  }, { passive: false });

  els.aiDialogCancel.addEventListener('click', closeAiDialog);
  els.aiDialogCurrent.addEventListener('click', aiCurrent);
  els.aiDialogAll.addEventListener('click', aiAll);

  els.exportNext.addEventListener('click', chooseExportDir);
  els.exportCancel.addEventListener('click', closeExport);
  els.exportBack.addEventListener('click', () => {
    els.exportWhere.hidden = true;
    els.exportPick.hidden = false;
    els.exportNote.textContent = '导出前会按原分辨率重新渲染，不会压缩画质。';
    syncExportCount();
  });
  els.exportStart.addEventListener('click', runExport);
  els.exportDone.addEventListener('click', closeExport);
  els.exportAll.addEventListener('click', () => {
    state.exportSelected = new Set(state.images.map((entry) => entry.id));
    renderExportList();
  });
  els.exportNone.addEventListener('click', () => {
    state.exportSelected.clear();
    renderExportList();
  });
  els.exportDialog.addEventListener('cancel', (event) => {
    if (state.exporting || state.picking) event.preventDefault();
  });
  els.exportReveal.addEventListener('click', async () => {
    try {
      await fetch('/api/dsh-beauty/reveal', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ dir: state.exportDir }),
      });
    } catch (error) {
      setStatus('无法打开文件夹：' + String(error.message || error), 'err');
    }
  });

  document.addEventListener('keydown', (event) => {
    const key = event.key.toLowerCase();
    if ((event.metaKey || event.ctrlKey) && key === 's') {
      event.preventDefault();
      if (!els.saveTop.disabled) openExport();
    }
    // Cmd/Ctrl+Z is the natural undo for liquify; redo is Shift+Cmd/Ctrl+Z.
    if ((event.metaKey || event.ctrlKey) && key === 'z' && state.sourceId) {
      if (state.mask.on && !event.shiftKey && state.mask.strokes.length) {
        event.preventDefault();
        state.mask.strokes.pop();
        updateMaskUI();
        render();
        saveSession();
        return;
      }
      if (state.wrinkle.on && !event.shiftKey && state.wrinkle.strokes.length) {
        event.preventDefault();
        state.wrinkle.strokes.pop();
        updateWrinkleUI();
        render();
        saveSession();
        return;
      }
      if (!state.liquid.strokes.length && !state.liquid.redo.length) return;
      event.preventDefault();
      if (event.shiftKey) redoLiquid(); else undoLiquid();
    }
  });

  els.folder.addEventListener('click', async () => {
    try {
      await fetch('/api/dsh-beauty/reveal', { method: 'POST', credentials: 'same-origin' });
    } catch (error) {
      setStatus('无法打开文件夹：' + String(error.message || error), 'err');
    }
  });

  // Flush the snapshot when the iframe is torn down or the tab is hidden, and
  // after every pointer release so a click on another sidebar item cannot race
  // the debounced write.
  window.addEventListener('pointerup', () => scheduleSessionSave(30));
  window.addEventListener('pagehide', saveSession);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveSession();
  });
  for (const key of [...sliders, ...colours]) {
    $(key).addEventListener('change', saveSession);
  }

  updateLiquidUI();
  updateMaskUI();
  updateWrinkleUI();
  syncLabels();
  setTone(state.tone.temperature, state.tone.tint, { commit: false });

  // Deep link: ?src=<sourceId>&preset=<name> — used by the panel and by screenshot tests.
  const query = new URLSearchParams(location.search);
  const linked = query.get('src');
  if (linked && /^src_[0-9a-f]{20}$/.test(linked)) {
    sessionReady = true;
    // A preset goes straight into the single linked photo's params; without
    // one the workbench starts from the saved defaults and makeup colours.
    const preset = PRESETS[query.get('preset') || ''] || defaultParams();
    state.images = [createEntry(linked, '', preset)];
    state.active = 0;
    renderFilmstrip();
    if (PRESETS[query.get('preset') || '']) rememberColours();
    loadImageAt(0, { skipCapture: true })
      .then((ok) => { if (ok) saveSession(); })
      .catch((error) => setStatus(String(error.message || error), 'err'));
  } else {
    // No photo in the URL: pick up every photo that was open before this
    // iframe was destroyed by a sidebar switch.
    const saved = readSession();
    if (saved) {
      sessionReady = true;
      restoreSession(saved)
        .catch((error) => setStatus('恢复上次编辑失败：' + String(error.message || error), 'err'));
    } else {
      sessionReady = true;
    }
  }
})();
</script>
</body>
</html>
